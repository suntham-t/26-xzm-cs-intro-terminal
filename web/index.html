<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>智能计算概论学习终端</title>
<style>
/* ===== 00-tokens.css ===== */
/* =====================================================================
   00-tokens.css —— 设计变量（唯一的颜色/尺寸权威）
   ---------------------------------------------------------------------
   为什么单独一个文件：深色模式只允许在这一层做覆盖。
   组件文件里出现任何写死的 hex/rgba，深色模式一定会漏。
   ---------------------------------------------------------------------
   主题切换方式：<html data-theme="light"|"dark">。
   浅色是默认；JS 只负责设属性 + 记住选择，不参与任何配色计算。
   ===================================================================== */

:root{
  /* ---------- 面 ---------- */
  --c-canvas:#F2F4F8;          /* 应用底 */
  --c-canvas-2:#E9EDF4;        /* 更深的底（极少用：滚动条槽） */
  --c-surface:#FFFFFF;         /* 卡/面板/输入 */
  --c-surface-2:#F8FAFD;       /* 次级面：代码、表头、静态条 */
  --c-surface-3:#EDF1F7;       /* hover / 选中底 */
  --c-surface-4:#E3E9F2;       /* 再深一档：按下态 */
  --c-glass:rgba(255,255,255,.82);   /* 半透明浮层底（tooltip/toast/补全） */
  /* ---------- 导航脊（左侧图标栏）---------- */
  --c-rail:#101728;
  --c-rail-2:#18213A;
  --c-rail-3:#212C4A;
  --c-rail-fg:#93A2BF;
  --c-rail-fg-on:#FFFFFF;
  --c-rail-line:rgba(255,255,255,.08);
  /* ---------- 线 ---------- */
  --c-line:#E2E7F0;
  --c-line-2:#EFF2F7;          /* 比 line 更淡：卡片内分隔 */
  --c-line-strong:#CBD3E1;
  /* ---------- 字 ---------- */
  --c-text:#131A26;
  --c-text-2:#4B5668;
  --c-text-3:#7F8A9C;
  --c-text-4:#A8B2C1;          /* 极弱：占位、计数、禁用 */
  --c-text-inv:#FFFFFF;
  /* ---------- 强调 ---------- */
  --c-accent:#3B5BFD;
  --c-accent-2:#6C86FF;
  --c-accent-ink:#1B34C4;      /* 浅底上的强调文字（对比度够） */
  --c-accent-soft:#EDF0FF;
  --c-accent-soft-2:#DDE3FF;
  --c-accent-line:#C3CDFF;
  /* 强调色/强调渐变之上的前景色。两套主题下都接近白 —— 强调色本身在深色模式会变亮，
     真正需要跟着变的是它"后面"的那一层，所以这里不需要深色覆盖。 */
  --c-on-accent:#FFFFFF;
  --c-on-accent-dim:rgba(255,255,255,.78);
  /* ---------- 语义色 ---------- */
  --c-ok:#0E9F6E;   --c-ok-2:#12B981;   --c-ok-soft:#E6F7F1;   --c-ok-line:#B7E8D7;
  --c-warn:#B45309; --c-warn-soft:#FFF7EA; --c-warn-line:#F5DDB6;
  --c-err:#D92D20;  --c-err-soft:#FEECEB;  --c-err-line:#F6C4C0;
  /* ---------- 代码 / 终端 ----------
     终端是全 app 唯一的深色内容面（和左侧深色脊呼应）。
     它不跟主题走：深色模式下只是"更深一点"，浅色模式下也是深底 —— 终端就该是黑的。 */
  --c-term:#0B1220;
  --c-term-2:#0F1729;          /* 输出区（更深） */
  --c-term-3:#141F36;          /* 输入行 / 头部 */
  --c-term-fg:#D7E0F0;
  --c-term-fg-dim:#7C8BA8;
  --c-term-accent:#7DD3FC;     /* >>> 提示符：青蓝，和主强调蓝区分开 */
  --c-term-line:rgba(255,255,255,.07);
  --c-term-err:#FFB4AB;
  --c-term-err-bg:rgba(217,45,32,.14);
  --c-term-ok:#7BE3B4;
  --c-code:#F6F8FC;            /* 正文里的代码块底 */
  --c-code-line:#E4E9F2;
  /* ---------- 遮罩 ---------- */
  --c-scrim:rgba(11,16,28,.42);
  --c-shadow-tint:16,23,40;    /* 阴影用的 rgb 分量 */

  /* ---------- 字体 ----------
     ★ 中文正文必须宋体（用户硬要求）。三套字体各司其职，别混：
       read → 讲义原文、AI 正文、100days 正文
       ui   → 按钮 / chip / 计数 / 章节号 / 提示
       mono → 代码 / 终端 / 行号 / 时长 */
  --font-read:Georgia,Cambria,"Times New Roman",SimSun,"宋体",
              "Source Han Serif SC","Noto Serif CJK SC",serif;
  --font-ui:system-ui,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  --font-mono:Consolas,"Cascadia Mono","Courier New",monospace;

  --fs-11:11px;  --fs-105:10.5px; --fs-12:12px;  --fs-125:12.5px; --fs-13:13px;
  --fs-135:13.5px; --fs-14:14px; --fs-15:15px;  --fs-16:16px;
  --fs-17:17px;  --fs-18:18px;  --fs-20:20px;   --fs-24:24px; --fs-28:28px;
  --lh-ui:1.6; --lh-read:1.95; --lh-title:1.35;

  /* ---------- 形状 ---------- */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-12:12px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-7:28px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;

  /* ---------- 阴影：三层叠出"纸浮起来"的感觉，单层会显得脏 ---------- */
  --sh-xs:0 1px 2px rgba(var(--c-shadow-tint),.05);
  --sh-sm:0 1px 2px rgba(var(--c-shadow-tint),.05),0 2px 8px rgba(var(--c-shadow-tint),.05);
  --sh-md:0 1px 2px rgba(var(--c-shadow-tint),.04),0 8px 24px rgba(var(--c-shadow-tint),.07);
  --sh-lg:0 2px 6px rgba(var(--c-shadow-tint),.06),0 18px 48px rgba(var(--c-shadow-tint),.13);
  --sh-xl:0 4px 12px rgba(var(--c-shadow-tint),.08),0 32px 72px rgba(var(--c-shadow-tint),.18);
  --sh-focus:0 0 0 3px color-mix(in srgb, var(--c-accent) 22%, transparent);
  --sh-focus-err:0 0 0 3px color-mix(in srgb, var(--c-err) 20%, transparent);
  --sh-rail:0 6px 18px rgba(9,13,24,.34);
  --sh-fab:0 8px 24px color-mix(in srgb, var(--c-accent) 34%, transparent);

  /* ---------- 动效 ---------- */
  --dur-1:100ms; --dur-2:140ms; --dur-3:200ms; --dur-4:280ms;
  --ease:cubic-bezier(.2,.7,.3,1);

  /* ---------- 层次（沿用 JS/CSS 的既有契约，只补名字）---------- */
  --z-scrim:40; --z-repl:45; --z-rail:52; --z-modal:60; --z-fab:70;
  --z-bubble:75; --z-toast:80; --z-tip:90;

  /* ---------- 布局尺寸（组件与 shell 共用，改一处就够）---------- */
  --w-rail:60px;        /* 左侧图标栏 */
  --w-toc:296px;        /* 目录 */
  --w-materials:336px;  /* 材料栏 */
  --h-header:56px;
  --h-footer:60px;
  --w-card:840px;       /* 阅读卡最大宽度 */
  --measure-read:42em;  /* 正文行宽上限（中文一行的舒适上限） */

  color-scheme: light;
}

/* =====================================================================
   深色模式：只覆盖 token。
   ---------------------------------------------------------------------
   不是"浅色反相"：深色下纸面用 #141A26 而不是纯黑（纯黑 + 白字对比过强，
   读长文会累）；发丝线用半透明白（在任何一层面板上都成立）；
   强调色提亮一档（深底上 #3B5BFD 会发暗，看不清）。
   ===================================================================== */
html[data-theme="dark"]{
  --c-canvas:#0B0F18;
  --c-canvas-2:#080B12;
  --c-surface:#141A26;
  --c-surface-2:#19202E;
  --c-surface-3:#212938;
  --c-surface-4:#2A3346;
  --c-glass:rgba(20,26,38,.88);
  --c-rail:#080B12;
  --c-rail-2:#151C2B;
  --c-rail-3:#1D2637;
  --c-rail-fg:#8B9AB8;
  --c-rail-fg-on:#FFFFFF;
  --c-rail-line:rgba(255,255,255,.06);
  --c-line:#232C3D;
  --c-line-2:#1C2432;
  --c-line-strong:#33405A;
  --c-text:#E5EAF4;
  --c-text-2:#B2BDD1;
  --c-text-3:#8794AA;
  --c-text-4:#66738A;
  --c-text-inv:#0B0F18;
  --c-accent:#6C86FF;
  --c-accent-2:#8DA2FF;
  --c-accent-ink:#A9BAFF;
  --c-accent-soft:#1B2440;
  --c-accent-soft-2:#222E52;
  --c-accent-line:#2E3C63;
  --c-ok:#34D399;   --c-ok-2:#4BD5A8;   --c-ok-soft:#0F2A22;    --c-ok-line:#1E4A3C;
  --c-warn:#F0B25A; --c-warn-soft:#2A2113; --c-warn-line:#4A3A1C;
  --c-err:#FF8A80;  --c-err-soft:#2C1614;  --c-err-line:#4E2724;
  --c-term:#070B13;
  --c-term-2:#05080E;
  --c-term-3:#0D1523;
  --c-term-fg:#D7E0F0;
  --c-term-fg-dim:#6E7C96;
  --c-code:#101724;
  --c-code-line:#1F2937;
  --c-scrim:rgba(3,6,12,.62);
  --c-shadow-tint:0,0,0;
  --sh-md:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.38);
  --sh-lg:0 2px 6px rgba(0,0,0,.34),0 18px 48px rgba(0,0,0,.48);
  --sh-xl:0 4px 12px rgba(0,0,0,.40),0 32px 72px rgba(0,0,0,.56);
  --sh-fab:0 8px 24px color-mix(in srgb, var(--c-accent) 40%, transparent);
  color-scheme: dark;
}

/* ===== 10-base.css ===== */
/* =====================================================================
   10-base.css —— 复位 / 基础元件 / 通用工具
   ---------------------------------------------------------------------
   这一层只做两件事：
     1) 把浏览器默认样式压平（不同 WebView 版本的默认 margin/字体差异会直接
        体现在排版上，必须显式钉死）；
     2) 给"到处都在用的东西"一套统一样式：按钮、输入框、滚动条、选中高亮、
        焦点环、图标尺寸、动效曲线。
   组件自己的外观一律去 30/40/50 那几个文件里写，这里不下场。
   ===================================================================== */

*,*::before,*::after{ box-sizing:border-box; }

html,body{ height:100%; }

/* 隐藏语义：本项目大量使用 el.hidden 控制显隐，必须压过 display:flex 这类声明 */
[hidden]{ display:none !important; }

body{
  margin:0;
  background:var(--c-canvas);
  color:var(--c-text);
  font:var(--fs-14)/var(--lh-ui) var(--font-ui);
  -webkit-font-smoothing:antialiased;   /* WebView2 在 125%/150% 缩放下不抗锯齿会发毛 */
  text-rendering:optimizeLegibility;
  overflow:hidden;                       /* 唯一的滚动区是 main / 各面板自己的 body */
}
/* 关闭高 DPI 下 WebView 的边缘闪烁 */
html{ background:var(--c-canvas); }

h1,h2,h3,h4,h5,h6{ margin:0; font-weight:600; line-height:var(--lh-title); }
p{ margin:0; }
ul,ol{ margin:0; padding:0; }
a{ color:var(--c-accent-ink); text-decoration:none; }
a:hover{ text-decoration:underline; }
hr{ border:0; border-top:1px solid var(--c-line); margin:var(--sp-5) 0; }
img{ max-width:100%; }

/* 代码：任何情况下都不许掉进宋体（宋体的等宽是位图化的，代码会糊） */
code,pre,kbd,samp,.mono{ font-family:var(--font-mono); }

/* ---------------- 按钮 ----------------
   一个基础按钮 = 白底 + 发丝边 + 圆角 8 + 13px。所有"特殊按钮"
   （图标栏 .sb、点阵 .dot、面板行 .hwRow、页签 .tab…）在各自文件里覆盖掉它。
   display:inline-flex 是为了让图标和文字天然居中对齐（不在每个按钮里写 vertical-align）。 */
button{
  font:500 var(--fs-13)/1.45 var(--font-ui);
  color:var(--c-text-2);
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-sm);
  padding:7px 13px;
  cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  white-space:nowrap; vertical-align:middle;
  user-select:none;
  transition:background-color var(--dur-2) var(--ease),
             border-color var(--dur-2) var(--ease),
             color var(--dur-2) var(--ease),
             box-shadow var(--dur-2) var(--ease),
             transform var(--dur-1) var(--ease);
}
button:hover:not(:disabled){
  background:var(--c-surface-2);
  border-color:var(--c-line-strong);
  color:var(--c-text);
}
button:active:not(:disabled){
  background:var(--c-surface-3);
  transform:translateY(.5px);        /* 按压反馈只要 0.5px：多了会像"跳了一下" */
}
button:disabled{ opacity:.42; cursor:default; }
button:focus-visible{ outline:2px solid var(--c-accent); outline-offset:2px; }

button.primary{
  background:var(--c-accent); border-color:var(--c-accent); color:#fff; font-weight:600;
  box-shadow:0 1px 2px color-mix(in srgb, var(--c-accent) 30%, transparent);
}
button.primary:hover:not(:disabled){
  background:var(--c-accent-2); border-color:var(--c-accent-2); color:#fff;
  box-shadow:0 2px 8px color-mix(in srgb, var(--c-accent) 34%, transparent);
}
button.primary:active:not(:disabled){ background:var(--c-accent); }

/* 文字按钮：出现在正文里（"复制代码"、"点我刷新"这种），不能长得像控件 */
button.linkbtn{
  background:none; border:0; padding:2px 1px; border-radius:var(--r-xs);
  color:var(--c-accent-ink); font-weight:500;
}
button.linkbtn:hover:not(:disabled){ background:none; color:var(--c-accent); text-decoration:underline; }

/* 工具条小按钮（代码块下方、面板头、终端头） */
button.tb{
  font-size:var(--fs-12); padding:4px 9px; border-radius:var(--r-xs);
  background:transparent; border-color:transparent; color:var(--c-text-3);
}
button.tb:hover:not(:disabled){ background:var(--c-surface-3); border-color:transparent; color:var(--c-text); }
button.tb.on{
  background:var(--c-accent-soft); border-color:var(--c-accent-line);
  color:var(--c-accent-ink); font-weight:600;
}
button.big{ padding:11px 18px; font-size:var(--fs-135); border-radius:var(--r-md); }

/* ---------------- 图标 ----------------
   尺寸用 em：按钮字号变了图标跟着变，不用到处写 px。
   描边宽度在这里统一（个别需要更细的图标自己加 .ico-thin）。 */
.ico{
  width:1.05em; height:1.05em; flex:none; display:inline-block;
  vertical-align:-.16em; stroke-width:1.8;
}
.ico-14{ width:14px; height:14px; }
.ico-16{ width:16px; height:16px; }
.ico-18{ width:18px; height:18px; }
.ico-20{ width:20px; height:20px; }
.ico-24{ width:24px; height:24px; }

/* ---------------- 输入 ----------------
   只写"通用输入"，具体面板（设置页 / 搜索框 / 作业代码框 / 助手输入框）
   在 40/50 里各自覆盖。focus 用 box-shadow 而不是 outline：
   outline 在 WebView2 里不会跟着圆角走，会画出一个方框。 */
input,select,textarea{
  font-family:var(--font-ui);
  font-size:var(--fs-13);
  color:var(--c-text);
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-sm);
  padding:7px 10px;
  outline:none;
  transition:border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
input::placeholder,textarea::placeholder{ color:var(--c-text-4); }
input:focus,select:focus,textarea:focus{
  border-color:var(--c-accent);
  box-shadow:var(--sh-focus);
}
input:disabled,select:disabled,textarea:disabled{ opacity:.5; cursor:not-allowed; }
textarea{ resize:vertical; line-height:1.7; }
select{ cursor:pointer; }

/* ---------------- 滚动条 ----------------
   Windows 默认滚动条又宽又灰，会把"纸面"的观感毁掉。
   width 10 + 3px 透明边框 + background-clip:content-box = 4px 视觉宽度、10px 可点。 */
*{ scrollbar-width:thin; scrollbar-color:var(--c-surface-4) transparent; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{
  background:var(--c-surface-4);
  border-radius:var(--r-pill);
  border:3px solid transparent;
  background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{ background:var(--c-text-4); background-clip:content-box; }
::-webkit-scrollbar-corner{ background:transparent; }

/* ---------------- 选区 / 焦点 ---------------- */
::selection{ background:color-mix(in srgb, var(--c-accent) 26%, transparent); color:var(--c-text); }
::-moz-selection{ background:color-mix(in srgb, var(--c-accent) 26%, transparent); color:var(--c-text); }

:focus-visible{ outline:2px solid var(--c-accent); outline-offset:2px; }
/* 鼠标点击不要出焦点环（会给"按钮被框住"的错觉），只留键盘 */
button:focus:not(:focus-visible),a:focus:not(:focus-visible){ outline:none; }

/* ---------------- 通用工具类 ---------------- */
.sp{ flex:1 1 auto; min-width:0; }     /* 把右边的元素推到最右：全站都在用 */
.srOnly{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.dim{ color:var(--c-text-3); }
.nowrap{ white-space:nowrap; }
.loading{ color:var(--c-text-3); font-size:var(--fs-135); padding:14px 2px; }

/* ---------------- 动效 ----------------
   全部只动 opacity / transform（合成层友好，WebView 里不掉帧）。
   全部遵守 prefers-reduced-motion。 */
@keyframes fadeIn{ from{ opacity:0 } to{ opacity:1 } }
@keyframes riseIn{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
@keyframes popIn{
  from{ opacity:0; transform:scale(.97) } to{ opacity:1; transform:none }
}
@keyframes blink{ 50%{ opacity:0 } }
@keyframes shimmer{ from{ background-position:-160% 0 } to{ background-position:160% 0 } }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* ===== 20-shell.css ===== */
/* =====================================================================
   20-shell.css —— 应用外壳（骨架）
   ---------------------------------------------------------------------
   横向：左侧深色图标栏 ‖ 右侧工作区
   右侧工作区竖向：顶栏 / 「继续上次」条 / #shell（目录 ‖ 阅读区 ‖ 材料栏）/ 终端 / 底栏

   ★ 为什么图标栏是 body 的直接子元素：它要从窗口最顶一直画到最底（顶栏不横跨整页），
     这样"深色脊 + 浅色纸"的结构对比才是完整的。
   ★ 四段的纵向分配必须写全（顶栏 fixed / 主体 flex:1 / 终端 fixed / 底栏 fixed），
     否则窗口一矮，主体会被 header/footer 的 flex 挤压（这个坑注释里记过）。
   ===================================================================== */

body{
  display:flex; flex-direction:row;
  background:var(--c-canvas);
}
#rightPane{
  flex:1; min-width:0; min-height:0;
  display:flex; flex-direction:column;
  overflow:hidden;
}
#rightPane > header,
#rightPane > footer,
#rightPane > #repl,
#rightPane > #resume{ flex:none; }

/* ============================ 左侧图标栏 ============================
   深墨蓝的"活动栏"（IDE 那种）。上面是品牌标记，中间是功能，下面是设置，
   中间用一个弹性空白把底部那组顶到底。 */
#sideBar{
  flex:none; width:var(--w-rail); height:100%;
  display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:10px 0 12px;
  background:var(--c-rail);
  border-right:1px solid var(--c-rail-line);
  z-index:var(--z-rail);
  overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none;
}
#sideBar::-webkit-scrollbar{ width:0; height:0; }

/* 品牌标记：一块渐变方块。不做按钮（点它不知道该去哪），纯视觉锚点 */
.sbBrand{
  flex:none; width:32px; height:32px; margin-bottom:8px;
  border-radius:9px; display:grid; place-items:center;
  color:#fff;
  background:linear-gradient(145deg, var(--c-accent) 0%, var(--c-accent-2) 100%);
  box-shadow:0 4px 12px color-mix(in srgb, var(--c-accent) 46%, transparent);
}
.sbBrand svg{ width:18px; height:18px; display:block; }

/* 图标按钮：44 命中区（40 视觉 + 间距），圆角 11 */
.sb{
  position:relative;
  flex:none; width:40px; height:40px; padding:0;
  display:grid; place-items:center;
  border:0; border-radius:11px;
  background:transparent; color:var(--c-rail-fg);
  cursor:pointer;
  transition:background-color var(--dur-2) var(--ease),
             color var(--dur-2) var(--ease);
}
.sb .sbi{ display:block; width:19px; height:19px; }
.sb:hover:not(:disabled){ background:var(--c-rail-2); color:var(--c-rail-fg-on); }
.sb:active:not(:disabled){ background:var(--c-rail-3); }
.sb.on{ background:var(--c-rail-3); color:var(--c-rail-fg-on); }
/* 选中态：左缘一条 3px 强调条（贴在栏的边上，不是按钮的边上） */
.sb.on::before{
  content:""; position:absolute; left:-10px; top:50%;
  width:3px; height:18px; border-radius:0 3px 3px 0;
  background:linear-gradient(180deg, var(--c-accent-2), var(--c-accent));
  transform:translateY(-50%);
}
.sb:focus-visible{ outline:2px solid var(--c-accent-2); outline-offset:-2px; }
/* 分组分隔：在"这一组第一个"的上方画一条发丝线（用 ::after 给 .on 的 ::before 让路） */
.sb[data-group]{ margin-top:9px; }
.sb[data-group]::after{
  content:""; position:absolute; top:-5px; left:8px; right:8px;
  height:1px; background:var(--c-rail-line);
}
.sbSp{ flex:1 1 auto; min-height:6px; }
/* 主题按钮：太阳/月亮两个图标都在 DOM 里，靠主题属性显示其中一个。
   为什么不交给 JS 换 innerHTML：那样每次切主题都要重建按钮节点，
   悬停态/焦点会被打断；纯 CSS 切换零成本。 */
#btnTheme .icoMoon{ display:none; }
html[data-theme="dark"] #btnTheme .icoSun{ display:none; }
html[data-theme="dark"] #btnTheme .icoMoon{ display:block; }

/* 悬停提示：图标栏自己 overflow-y:auto，气泡必须挂在 body 上（否则被裁）。
   深色栏上用浅色气泡：反相才看得见。 */
#sbTip{
  position:fixed; z-index:var(--z-tip); pointer-events:none;
  max-width:280px; padding:7px 11px;
  background:var(--c-surface); color:var(--c-text);
  border:1px solid var(--c-line); border-radius:var(--r-md);
  box-shadow:var(--sh-lg);
  font:500 var(--fs-125)/1.45 var(--font-ui); white-space:nowrap;
  opacity:0; transform:translateX(-3px);
  transition:opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
#sbTip.on{ opacity:1; transform:none; }

/* ============================ 顶栏 ============================
   只回答"我在哪"：品牌 › 章 › 节；右侧是连续天数。
   动作按钮全在图标栏（这是上一轮就定下的方向，别往这里加按钮）。 */
header{
  height:var(--h-header);
  display:flex; align-items:center; gap:10px;
  padding:0 20px;
  background:var(--c-surface);
  border-bottom:1px solid var(--c-line);
  z-index:2;
}
.hrow{
  display:flex; align-items:center; gap:0;
  flex:1 1 auto; min-width:0;
  overflow:hidden;
}
/* 品牌：一颗强调色小圆点 + "计算概论 B"。不是按钮，别做成按钮的样式 */
.brand{
  display:inline-flex; align-items:center; gap:7px;
  font:600 var(--fs-125)/1 var(--font-ui);
  letter-spacing:.04em; color:var(--c-text);
  white-space:nowrap;
}
.brand::before{
  content:""; width:6px; height:6px; border-radius:50%;
  background:var(--c-accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--c-accent) 16%, transparent);
}
/* 分隔符由 ::before 生成，空元素不画（:not(:empty) 是关键 —— chapterTitle 在空状态时是空的） */
.chapterTitle,.secLabel{
  display:inline-flex; align-items:center; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chapterTitle:not(:empty)::before,.secLabel:not(:empty)::before{
  content:"›"; margin:0 9px; color:var(--c-text-4);
  font-weight:400; font-size:var(--fs-13);
}
.chapterTitle{
  font-size:var(--fs-13); color:var(--c-text-2); font-weight:500;
}
.secLabel{ font-size:var(--fs-13); color:var(--c-text-3); font-weight:400; }
.secLabel .secTitleInl{ color:var(--c-text); font-weight:600; margin-left:5px; }

/* 连续天数：一枚 chip。数字用强调色，火的图标（JS 里会换成 SVG）跟着走 */
.streak{
  display:inline-flex; align-items:center; gap:5px;
  flex:none;
  font:500 var(--fs-125)/1 var(--font-ui);
  color:var(--c-text-2);
  background:var(--c-surface-3);
  border-radius:var(--r-pill);
  padding:5px 11px;
  white-space:nowrap;
}
.streak b{ color:var(--c-accent); font-weight:700; font-variant-numeric:tabular-nums; }
.streak .ico{ color:var(--c-accent); }

/* 「继续上次」：一条比顶栏更轻的横幅，用浅强调底把它和正文区分开 */
#resume{
  height:38px; display:flex; align-items:center;
  padding:0 20px;
  background:var(--c-accent-soft);
  border-bottom:1px solid var(--c-accent-line);
}
#resume button{
  font-size:var(--fs-125); font-weight:500; color:var(--c-accent-ink);
  display:inline-flex; align-items:center; gap:6px;
}
#resume button:hover:not(:disabled){ color:var(--c-accent); }
/* ★ 不要再给 #resume 按钮加 ::after 箭头：JS 塞进去的文案本身就以 "→" 结尾
   （renderResume 拼的是 "继续上次：… →"），再加一个就变成两个箭头。 */

/* ============================ 主体三栏 ============================ */
#shell{
  flex:1 1 auto; min-height:0;
  display:flex; align-items:stretch;
  overflow:hidden;
}

/* 阅读区是唯一的纵向滚动容器（翻卡时只有它在动） */
main{
  flex:1 1 auto; min-width:0; min-height:0;
  overflow-y:auto;
  display:flex; justify-content:center; align-items:flex-start;
  padding:24px 24px 72px;
}

/* 阅读卡 / 内嵌面板：同一个"纸面"外观。
   ★ 内容样式（标题/正文/代码块…）在 30-card.css —— 那里不要重复定义这两个选择器的盒子，
     否则内边距会加倍。 */
#card,#inlinePanel{
  width:100%; max-width:var(--w-card); min-width:0;
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-md);
  padding:36px 44px 40px;
  position:relative;
}
#inlinePanel{ padding:22px 32px 36px; }
/* 内嵌面板的头：比卡片标题轻一档，别和"知识点标题"抢层级 */
#inlinePanel > .panelHead{
  margin:0 0 16px; padding:0 0 12px;
  min-height:0;
  border-bottom:1px solid var(--c-line-2);
}
/* 翻卡动画：只动 opacity + 4px 位移。走 GPU 合成，不触发布局 */
#card.enter{ animation:riseIn var(--dur-3) var(--ease); }
/* 空状态卡 / 收尾卡自己已经有内边距 */
#card > .emptyCard:only-child,
#card > .endCard:only-child{ padding:10px 8px 6px; }

/* 内嵌面板 / 材料栏里常出现的"块级小节标题"（其实 .secHead 在卡里也用） */
.secHead{
  font:600 var(--fs-11)/1.4 var(--font-ui);
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--c-text-4);
  margin-bottom:8px;
}

/* ---------------------------- 左栏：目录 ---------------------------- */
#toc{
  flex:none; width:var(--w-toc); min-height:0;
  display:flex; flex-direction:column;
  background:var(--c-surface);
  border-right:1px solid var(--c-line);
}
#tocBody{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  padding:8px 12px 28px;
}
/* 窄屏（<1100px）：目录变成从左边滑出的抽屉。left 要给图标栏让位，
   否则抽屉会被 60px 的图标栏盖掉一条（原来 left:0 就踩过这个）。 */
body[data-wide="0"] #toc{
  /* ★ 抽屉从顶栏**下面**开始：面包屑是"我在哪"，被抽屉盖掉之后
     用户就不知道自己正翻到哪一章了。左边仍然给 60px 图标栏让位。 */
  position:fixed; top:var(--h-header); left:var(--w-rail); bottom:0;
  width:min(340px, 82vw); z-index:50;
  background:var(--c-surface);
  border-right:1px solid var(--c-line);
  box-shadow:var(--sh-xl);
  animation:drawerIn var(--dur-3) var(--ease);
}
@keyframes drawerIn{ from{ opacity:0; transform:translateX(-10px) } to{ opacity:1; transform:none } }

/* ---------------------------- 右栏：材料 ---------------------------- */
#rail{
  flex:none; width:var(--w-materials); min-height:0;
  display:flex; flex-direction:column;
  background:transparent;
  border-left:1px solid var(--c-line);
}
#railBody{
  flex:1 1 auto; min-height:0;
  overflow-y:auto;
  padding:16px 16px 28px;
}
.railHint{
  font-family:var(--font-read);
  font-size:var(--fs-13); line-height:1.85;
  color:var(--c-text-3);
  padding:4px 2px;
}
.railHint b{ color:var(--c-text-2); }
/* 材料栏里的"一节"做成一张小卡：参考列表和课件缩略图各自独立成块，
   滚动时容易分清"这块结束了"。 */
#railBody .railSec,
#railBody .slides{
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-lg);
  padding:12px 12px 14px;
  box-shadow:var(--sh-xs);
}
#railBody .slides{ margin-top:12px; }
#railBody .secHead{ margin:0 2px 8px; }
/* 参考项在右栏是"列表行"而不是 chip：整行可点、右侧一个 › */
#railBody .refs{
  display:flex; flex-direction:column; gap:1px;
  margin:0; padding:0; border:0;
}
#railBody .refs button.chip,
#railBody .refs span.chip{
  width:100%; text-align:left;
  border-radius:var(--r-sm);
  border-color:transparent; background:transparent;
  display:flex; align-items:center; gap:8px;
  padding:6px 8px;
  font-size:var(--fs-125); color:var(--c-text-2);
  box-shadow:none;
}
#railBody .refs button.chip::after{
  content:"›"; margin-left:auto; color:var(--c-text-4); font-size:var(--fs-14);
}
#railBody .refs button.chip:hover:not(:disabled){
  background:var(--c-surface-2); color:var(--c-accent-ink); border-color:transparent;
}
#railBody .refs button.chip:hover::after{ color:var(--c-accent); }
/* 右栏的课件缩略图排成一列大图 */
#railBody .thumbRow{ display:flex; flex-direction:column; gap:8px; }
#railBody button.thumbBtn{ width:100%; }

/* 收起状态：只剩一条 46px 的窄边 + 一个箭头，永远找得回来 */
#rail.collapsed{ width:46px; }
#rail.collapsed .panelHead{
  padding:10px 0; min-height:44px;
  justify-content:center; border-bottom:0;
}
#rail.collapsed #railTitle,
#rail.collapsed #railBody{ display:none; }

/* ---------------------------- 面板头（四处共用）---------------------------
   #toc / #rail / #modalBox / #inlinePanel 都用这一套。
   ✕ 用 margin-left:auto 顶到右边（不用 absolute，标题再长也不会压到它）。 */
.panelHead{
  flex:none;
  display:flex; align-items:center; gap:10px;
  padding:12px 14px;
  min-height:52px;
  border-bottom:1px solid var(--c-line-2);
}
.panelHead b{
  font:600 var(--fs-135)/1.3 var(--font-ui);
  color:var(--c-text);
  letter-spacing:.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.panelHead .xclose{ margin-left:auto; }

/* 关闭按钮：30×30 的图标按钮。以前是带下划线的蓝字，看起来像正文链接 */
.xclose{
  flex:none; width:30px; height:30px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:0; border-radius:var(--r-sm);
  background:transparent; color:var(--c-text-3);
  cursor:pointer; text-decoration:none;
  transition:background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.xclose:hover:not(:disabled){ background:var(--c-surface-3); border:0; color:var(--c-text); }
.xclose:active{ background:var(--c-surface-4); }
.xclose svg{ display:block; }
.xclose .ico{ width:15px; height:15px; stroke-width:2; }

/* 右栏折叠箭头 */
.railToggle{
  flex:none; width:28px; height:28px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:0; border-radius:var(--r-sm);
  background:transparent; color:var(--c-text-3);
  font-size:var(--fs-15); line-height:1; cursor:pointer;
  transition:background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.railToggle:hover:not(:disabled){ background:var(--c-surface-3); border:0; color:var(--c-text); }
#rail .panelHead .railToggle{ margin-left:auto; }

/* ============================ 底栏 ============================
   翻卡控件是**导航**不是主操作：左/右两个按钮做成"上一页/下一页"的软按钮，
   中间是点阵 + 计数。右侧那行快捷键提示固定靠右，且要给右下角助教圆钮让位。 */
footer{
  height:var(--h-footer);
  display:flex; align-items:center; justify-content:center;
  gap:14px; padding:0 20px;
  background:var(--c-surface);
  border-top:1px solid var(--c-line);
  position:relative;
  z-index:3;
}
footer button{
  padding:7px 14px; font-size:var(--fs-125); border-radius:var(--r-md);
  color:var(--c-text-2);
}
#btnNext:not(:disabled){
  background:var(--c-accent-soft);
  border-color:var(--c-accent-line);
  color:var(--c-accent-ink);
  font-weight:600;
}
#btnNext:hover:not(:disabled){
  background:var(--c-accent); border-color:var(--c-accent); color:#fff;
}
footer .dots{ margin:0 2px; }
footer .dotCount{ margin-left:2px; }

/* 点阵：按钮 15×15 的可点区域，里面画 7px 的点。
   这样 9 个点也能点得中（原来 9px 的点在 1080p 上很难点）。 */
.dots{ display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
.dot{
  width:16px; height:16px; padding:0;
  border:0; background:none; border-radius:50%;
  display:grid; place-items:center;
  cursor:pointer;
  transition:transform var(--dur-2) var(--ease);
}
.dot::after{
  content:""; width:7px; height:7px; border-radius:50%;
  background:var(--c-surface-4);
  box-shadow:inset 0 0 0 1px var(--c-line-strong);
  transition:background-color var(--dur-2) var(--ease),
             box-shadow var(--dur-2) var(--ease),
             transform var(--dur-2) var(--ease);
}
.dot:hover{ transform:scale(1.1); }
.dot:hover::after{ background:var(--c-accent-soft-2); box-shadow:inset 0 0 0 1px var(--c-accent); }
.dot.on::after{ background:var(--c-accent); box-shadow:none; }
/* 当前位置：实心 + 一圈浅环（空心的环和"没学"分不清，所以位置必须更重） */
.dot.cur::after{
  background:var(--c-accent);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--c-accent) 16%, transparent);
  transform:scale(1.05);
}
.dot:focus-visible{ outline:2px solid var(--c-accent); outline-offset:0; }

.dotCount{
  font:500 var(--fs-11)/1 var(--font-ui);
  color:var(--c-text-3);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
  padding:4px 9px; border-radius:var(--r-pill);
  background:var(--c-surface-3);
  white-space:nowrap;
}
footer .navhint{
  position:absolute; right:84px;
  font-size:var(--fs-11); color:var(--c-text-4);
  letter-spacing:.01em; white-space:nowrap;
}

/* ============================ 遮罩 / 终端容器 ============================ */
#scrim{
  position:fixed; inset:0;
  background:var(--c-scrim);
  z-index:var(--z-scrim);
  backdrop-filter:blur(1.5px);
  animation:fadeIn var(--dur-2) var(--ease);
}

/* 终端是底部抽屉：占版面而不是盖住卡片（翻卡阅读不受影响）。
   内部样式在 50-ai.css；这里只定盒子与那条拖拽条。 */
#repl{
  position:relative;
  display:flex; flex-direction:column;
  height:300px;                        /* JS 会用 ui.replh 覆盖成内联 height */
  min-height:140px;
  background:var(--c-term);
  border-top:1px solid color-mix(in srgb, #fff 10%, transparent);
  box-shadow:0 -8px 28px rgba(9,13,24,.20);
  z-index:var(--z-repl);
}
#replResize{
  position:absolute; top:-5px; left:0; right:0;
  height:10px; cursor:ns-resize; z-index:2;
}
#replResize::after{
  content:""; position:absolute; left:50%; top:4px;
  width:44px; height:3px; margin-left:-22px;
  border-radius:3px; background:transparent;
  transition:background-color var(--dur-2) var(--ease);
}
#replResize:hover::after{ background:color-mix(in srgb, var(--c-term-fg) 34%, transparent); }

/* ============================ 响应式 ============================
   断点：1100（目录常驻/抽屉）、1400（材料栏出现）—— 与 JS 的 TOCOPE_W/RAIL_W 一致。
   这里只管"宽度变窄时把内边距收小"，布局切换由 JS 的 data-wide 属性驱动。 */
@media (max-width:1000px){
  header{ padding:0 14px; }
  #resume{ padding:0 14px; }
  main{ padding:16px 14px 56px; }
  #card{ padding:26px 22px 30px; }
  #inlinePanel{ padding:16px 18px 28px; }
  footer{ padding:0 12px; gap:8px; }
  footer .navhint{ display:none; }
}

/* ===== 30-card.css ===== */
/* =====================================================================
   30-card.css —— 阅读卡里的内容层（卡片"里面"的一切）
   ---------------------------------------------------------------------
   负责范围（对应老样式表 old.css 的行段）：
     · #card 的内容节奏、.endCard.chapterCard（章首/章末材料卡）
     · 标题组 .kicker（eyebrow）+ h2.cardTitle
     · 视频区 .videoWrap / iframe.bili / .videoMeta / button.vlink 分P列表
     · 提示条 .warnbar 及 .novideo / .pitfall / .info / .err / .videopending
     · 正文排版 .body 全量（p / .md-h1..6 / ul / ol / blockquote / pre / code / a /
       hr / sup / sub / img / mark / details / figure / table.md-table）
     · 代码块 .codeBlock + .codeBar（作业面板 / AI 面板复用同一套，别改成卡片专用）
     · 「跑一下」.runBlock，参考 chip .refs/.chip，课件缩略图 .slides/.thumbRow
     · 空状态 / 收尾卡 .emptyCard / .endCard
     · 通用 markdown 容器 .md（100 Days 阅读器、AI 气泡、题面都用它）
     · 搜索命中高亮 .findmark
   卡片这个"盒子"（宽度 / 纸面 / 圆角 / 阴影 / 内边距）在 20-shell.css 的 #card 里，
   这里只管内容，不要重复定义盒子，否则内边距会加倍。

   和老样式比，动手改过的地方（都不是随手改的）：
     1) 正文 17px → 17.5px、行宽收到 42em：宋体在 17px 下笔画偏细；
        行长再长一点，整页读起来像一张放大的手机截图。
     2) 中文正文一律不用中间字重：SimSun 只有 400 / 700，500/600 会被算法合成加粗，
        在 150% 缩放下发糊。所以标题精确用 700、正文精确用 400，层级靠字号和颜色拉。
     3) .warnbar.novideo 从"黄底提示盒"降成一条 12.5px 灰字 + 2px 发丝线：
        104 张卡里 76 张都有它，黄底会让它变成整页最响的东西。
     4) 分P列表从"行内文字链接"改成"一行一条"的行式列表
        （级别 pill / P号 / 标题 / 时长），当前项左侧一条 2px 强调条。
     5) 代码块统一成 .codeBlock（pre + .codeBar 同圆角拼接）—— 老样式里
        卡片正文、AI 解析、作业面板各写了一套，现在只有这一套。
     6) 空状态 / 收尾卡的大图标改成"圆形浅强调底盘 + 居中图标位"：
        JS 里是 emoji（运行时换成内联 SVG），两种都不会错位。
     7) 讲义自带的 mark 用中性暖底、搜索命中的 mark.findmark 用较重的暖底 + 外圈，
        两套高亮必须一眼分得开（找不到命中词比"没高亮"更糟）。
     8) 卡片顺序已按新契约排：kicker → 标题 → 视频 → 正文。
        视频区的下外边距从"上/下都留"改成只留下边，上边由标题的 20px 撑开。

   字号 / 圆角的 token 说明：
     · 正文 17.5px 写成 calc(var(--fs-17) + .5px) 而不是硬编码 17.5px ——
       tokens 里最接近的就是 --fs-17。若 Lead 愿意加 --fs-read:17.5px，换一处即可。
     · 设计稿里"代码块 / 视频 / 跑一下块 r12"，tokens 没有 12（8/10/14/18），
       这里统一取 --r-md(10)：差 2px 看不出来，但守住"圆角只来自 token"。
   ===================================================================== */

/* ============================ 图标位置 ============================
   JS 运行时把界面上的 emoji 换成 <span class="emo"><svg class="ico">（见 app.js 的
   uiEmojiSwap）。基础对齐、尺寸、默认右外边距都在 90-polish.css 里统一给了，
   这里只做两件它管不到的组件级修正：
     ① 大标题旁边那颗图标要略小 —— 28px 衬线标题配 1.05em(≈29px) 图标会高过汉字；
     ② flex 容器（.chip / .runHead / .warnbar.pitfall>b …）本身已经有 gap，
        90-polish 给 .emo 的 .32em 右边距会和 gap 叠加，图标后面多出 4px。 */
h2.cardTitle .emo .ico{ width:.86em; height:.86em; }
.kicker .emo,
.chip .emo,
.videoMeta .emo,
.vbadge .emo,
.tag .emo,
.runHead .emo,
.runAdvice .emo,
.runActions .emo,
.codeBar .emo,
.warnbar.pitfall > b .emo,
.endBtns .emo,
.thumbCap .emo{ margin-right:0; }

/* ============================ 卡片内容节奏 ============================
   卡片的第一个块不能顶出额外的外边距；最后一个块的 margin-bottom 也要归零 ——
   老版里 .slides 的 margin-bottom 会把卡片底部的留白撑成一坨，看着像"卡片没写完"。 */
#card > *:first-child,
#inlinePanel > #inlineBody > *:first-child{ margin-top:0; }
#card > *:last-child{ margin-bottom:0; }

/* 章首 / 章末材料卡：抬头居中，正文仍然左对齐 ——
   这类卡一半是"标题页"一半是"正文页"，把整块都居中会让长段落失去起点。 */
.endCard.chapterCard{ text-align:left; }
.endCard.chapterCard > .kicker{ justify-content:center; }
/* ★ 这里的 h2 就是 .cardTitle（章首/章末卡的标题），必须显式钉回 28px：
   下面 .endCard h2 那条（24px）和 h2.cardTitle 特异性相同，靠书写顺序决胜 ——
   不钉的话，以后谁调一下段落顺序，章首标题就会莫名其妙小一号。 */
.endCard.chapterCard > h2.cardTitle{
  text-align:center;
  font-size:var(--fs-28);
  line-height:1.34;
}
.endCard.chapterCard > .body{ margin:var(--sp-5) 0 0; }
.endCard.chapterCard .slides{ text-align:left; }
.endCard.chapterCard .thumbRow{ justify-content:center; }
.endCard.chapterCard > .endBtns{ justify-content:center; }

/* ============================ 标题：eyebrow + 大标题 ============================
   这一组是全页"设计感"的来源：
     .kicker —— 无衬线 12px、字距 .08em、强调色、前面一颗 5px 的圆点；
     h2      —— 衬线 700、28px、行高 1.34。
   一个极小的无衬线抬头压着一个很大的衬线标题，大小对比就是层级。 */
.kicker{
  display:flex; align-items:center; gap:8px;
  margin:0 0 var(--sp-2);
  font:500 var(--fs-12)/1.4 var(--font-ui);
  letter-spacing:.08em;
  color:var(--c-accent);
}
.kicker::before{
  content:"";
  flex:none; width:5px; height:5px; border-radius:50%;
  background:var(--c-accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--c-accent) 15%, transparent);
}
.kicker b{ color:var(--c-accent-ink); font-weight:700; letter-spacing:.04em; }
.kicker .secTitleInl{ color:var(--c-text-2); letter-spacing:.02em; }

h2.cardTitle{
  margin:0 0 var(--sp-5);
  font:700 var(--fs-28)/1.34 var(--font-read);
  color:var(--c-text);
  letter-spacing:-.005em;
  overflow-wrap:anywhere;
}

/* ============================ 视频区 ============================
   播放器是嵌入的 B 站简化播放器（没有倍速、没有清晰度菜单，所以 .videoMeta
   右边必须留一个"去 B 站看"的出口）。iframe 只给宽度和 aspect-ratio，
   不写死高度：窗口变宽时高度自己跟着算，写死会变形。
   ★ 顺序是新契约：kicker → 标题 → 视频 → 正文。所以这块只有下外边距。 */
.videoWrap{ margin:0 0 var(--sp-6); }

iframe.bili{
  width:100%; height:auto;
  aspect-ratio:16 / 9;
  display:block;
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-term);        /* 黑底：播放器加载前是白块，白闪一下很刺眼 */
}

/* 抬头那行做成"左信息 / 右动作"两栏：左边 UP名 + 匹配状态，右边"去 B 站看"。
   ★ 不许换行（nowrap）：这一行一旦折成两行，下面的分P列表就被往下推，
     视频区和标题之间的留白会突然变成两倍。空间不够时只让 UP 名省略号。
   ★ 中间那个 .sp（结构里 JS 放的）要压扁 —— 右对齐由 .vHead 的 flex:1 完成，
     否则 .sp 会和 .vHead 平分余量，UP 名会提前一大截被截掉。 */
/* ★ 结构陷阱：.vList 在 DOM 里是 .videoMeta 的**子元素**
     （videoInnerHtml 里 "跑一下" 的收尾 </div> 在列表之后），不是兄弟。
   所以这一块本质是"两行的 flex"：
     第 1 行 = .vHead（左信息） + .sp + 「去 B 站看」（右动作）；
     第 2 行 = .vList（flex-basis:100%，独占一行）。
   这样不管窗口多窄，meta 行都不会折成两行、分P列表也永远单独起一行。 */
.videoMeta{
  margin-top:var(--sp-2);
  display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
  font-size:var(--fs-125); line-height:1.7; color:var(--c-text-3);
}
.videoMeta > .sp{ flex:0 1 0; min-width:0; }   /* 位置由 .vHead 的 flex:1 决定，它别抢余量 */
.videoMeta > button{ flex:none; }              /* 「去 B 站看」永远钉在右端，不许被挤掉 */
.vHead{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto; min-width:0; flex-wrap:nowrap;
  overflow:hidden;                             /* 空间不够时只让 UP 名出省略号 */
}
.vbadge{
  flex:0 1 auto; min-width:0;
  font-size:var(--fs-125); color:var(--c-text-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* 匹配状态徽标：已确认=绿，机器匹配待确认=暖色。
   这不是装饰 —— 它回答"这个知识点和视频到底对不对得上"。 */
.tag{
  flex:none;                       /* 匹配状态不许被压缩：它是"这视频对不对"的判据 */
  font:400 var(--fs-11)/1.75 var(--font-ui);
  padding:0 8px; border-radius:var(--r-pill);
  border:1px solid var(--c-ok-line);
  background:var(--c-ok-soft); color:var(--c-ok);
  white-space:nowrap;
}
.tag.unconf{ background:var(--c-warn-soft); border-color:var(--c-warn-line); color:var(--c-warn); }

/* ---- 分P列表：一行一条 ----
   一行里的顺序是 [级别 pill][P号][标题][时长]。.vttl 用 flex:1 吃掉剩余宽度，
   时长自然被推到右端；标题单行省略，列表才不会因为一条长标题变成锯齿。 */
.vList{
  flex:1 0 100%;                     /* 独占一整行：它和 meta 是同一条 flex 流 */
  margin:0;                          /* 上间距交给 .videoMeta 的 gap，别叠两次 */
  padding-top:var(--sp-1);
  border-top:1px solid var(--c-line-2);
  display:flex; flex-direction:column; gap:1px;
}
button.vlink{
  position:relative;
  width:100%; text-align:left;
  display:flex; align-items:center; gap:10px;
  padding:6px 10px 6px 12px;
  border:1px solid transparent; border-radius:var(--r-sm);
  background:none;
  font:400 var(--fs-125)/1.7 var(--font-ui);
  color:var(--c-text-2);
}
button.vlink:hover:not(:disabled){
  background:var(--c-surface-2);
  border-color:transparent;
  color:var(--c-accent-ink);
}
button.vlink:hover .vttl{ color:var(--c-accent-ink); }
button.vlink:hover .vdur{ color:var(--c-text-3); }
/* 当前播放项：左侧 2px 强调条 + 浅强调底（条贴在行的左缘，不是贴着文字） */
button.vlink.on{
  background:var(--c-accent-soft);
  color:var(--c-accent-ink);
}
button.vlink.on::before{
  content:"";
  position:absolute; left:0; top:50%;
  width:2px; height:16px; margin-top:-8px;
  border-radius:0 2px 2px 0;
  background:var(--c-accent);
}
button.vlink.on .vttl{ color:var(--c-accent-ink); font-weight:700; }
button.vlink.on .vno{ color:var(--c-accent); }

.vno{
  flex:none; min-width:30px;
  font-family:var(--font-mono); font-size:var(--fs-12);
  color:var(--c-text-4);
  font-variant-numeric:tabular-nums;
}
.vttl{
  flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:color var(--dur-2) var(--ease);
}
.vdur{
  flex:none; margin-left:var(--sp-2);
  font-family:var(--font-mono); font-size:var(--fs-11);
  color:var(--c-text-4);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
/* 级别标签（主线 / 基础 / 补充 / 拔高 / 拓展 / 回顾）：极小号 pill，不能抢标题的位置。
   min-width + 居中是为了让各行的 P 号对齐 —— 标签字数不一样（主线/补充），
   不对齐的话整列 P 号会左右跳，扫读时很难定位。 */
.vlev{
  flex:none;
  min-width:32px; text-align:center;
  font:400 var(--fs-11)/1.7 var(--font-ui);
  padding:0 6px; border-radius:var(--r-pill);
  background:var(--c-surface-3);
  color:var(--c-text-3);
  white-space:nowrap;
}
/* ============================ 提示条 ============================
   默认这一档就是"点坑 / 数据待确认"那种**值得停一下**的提示：
   浅暖底 + 左 3px 竖条 + 10px 圆角。蓝色（info）/ 红色（err）是同一条结构的变体。
   位置固定：都在标题之后、正文之前（视频区那个位），所以只给下外边距。 */
.warnbar{
  margin:0 0 var(--sp-6);
  padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--c-warn-line);
  border-left:3px solid var(--c-warn);
  border-radius:var(--r-md);
  background:var(--c-warn-soft);
  color:var(--c-text-2);
  font:400 var(--fs-13)/1.75 var(--font-ui);
}
.warnbar b{ font-weight:700; color:var(--c-warn); }
.warnbar .emo{ margin-right:1px; }

/* 「黑马这套没讲这块」是**信息**，不是**警告**：104 张卡里 76 张都有它。
   黄底会让它变成整页最响的东西 —— 降成一条灰字 + 2px 发丝线：还在，但不抢正文。 */
.warnbar.novideo{
  margin:0 0 var(--sp-6);
  padding:1px 0 1px 12px;
  border:0;
  border-left:2px solid var(--c-line);
  border-radius:0;
  background:none;
  color:var(--c-text-3);
  font-size:var(--fs-125);
  line-height:1.65;
}

/* 「点坑」是正文之后的补充阅读，所以和正文隔开一段，不贴在段尾 */
.warnbar.pitfall{ margin:var(--sp-6) 0 0; padding:var(--sp-3) var(--sp-4); }
/* 标题行留一个图标位：JS 里是 ⚠️（运行时换成内联 SVG），两条规则都兜住 */
.warnbar.pitfall > b{
  display:flex; align-items:center; gap:6px;
  margin:0 0 var(--sp-1);
  font:700 var(--fs-125)/1.5 var(--font-ui);
  letter-spacing:.02em;
  color:var(--c-warn);
}
.warnbar.pitfall > b .ico,
.warnbar.pitfall > b svg,
.warnbar.pitfall > b .emo .ico{ width:14px; height:14px; flex:none; }
.warnbar.pitfall > div{ color:var(--c-text-2); }

.warnbar.info{
  background:var(--c-accent-soft);
  border-color:var(--c-accent-line);
  border-left-color:var(--c-accent);
  color:var(--c-text-2);
}
.warnbar.info b{ color:var(--c-accent-ink); }
.warnbar.err{
  background:var(--c-err-soft);
  border-color:var(--c-err-line);
  border-left-color:var(--c-err);
  color:var(--c-text-2);
}
.warnbar.err b{ color:var(--c-err); }
/* 「待确认」是数据状态，和点坑同一档暖色：它俩都是"请留意"，不升级成错误 */
.warnbar.videopending{
  background:var(--c-warn-soft);
  border-color:var(--c-warn-line);
  border-left-color:var(--c-warn);
  color:var(--c-warn);
  font-size:var(--fs-125);
}

/* ============================ 正文 .body ============================
   讲义原文的阅读面：宋体、17.5px、行高 1.95。
   三条防坑规则写在这里，别删：
     · overflow-wrap:anywhere —— 讲义里有长 URL 和长英文单词，会顶破卡片；
     · font-variant-numeric:lining-nums —— Georgia 默认旧式数字（3/4/5/7/9 高低不一），
       正文里的行号、公式数字会被读错；
     · max-width:42em 只加在 #card / 章级卡上（下面单独一条）——
       题面、OJ 协议这些复用了 .body 的地方是窄弹层，收行宽反而更糟。 */
.body{
  font-family:var(--font-read);
  font-size:calc(var(--fs-17) + .5px);
  line-height:var(--lh-read);
  color:var(--c-text);
  overflow-wrap:anywhere;
  font-variant-numeric:lining-nums tabular-nums;
}
/* 行宽上限只给"阅读卡"这一种场景（42em ≈ 42 个汉字，中文一行的舒适上限） */
#card > .body,
.endCard.chapterCard > .body{ max-width:var(--measure-read); }

.body > *:first-child{ margin-top:0; }
.body > *:last-child{ margin-bottom:0; }

/* 段落间距 14px：1.95 行高下，12px 会让两段粘成一块，16px 又散；
   这个值是两档 token 之间的半步，视觉上最接近"书里的段距"。 */
.body p{ margin:0 0 14px; text-wrap:pretty; }
.body li{ margin:var(--sp-1) 0; text-wrap:pretty; }

/* 卡内小标题：h1-h3 用衬线 700（教材感），h4-h6 换成无衬线 700 的一行"导读"。
   注意元素永远是 h4（渲染器只出 h4 再挂 .md-hN 类），字号全靠类。 */
.body .md-h{
  margin:var(--sp-6) 0 var(--sp-2);
  font-family:var(--font-read);
  font-weight:700;
  line-height:1.45;
  color:var(--c-text);
  letter-spacing:0;
}
.body .md-h1{ font-size:var(--fs-24); }
.body .md-h2{ font-size:var(--fs-20); }
.body .md-h3{ font-size:var(--fs-18); }
.body .md-h4,
.body .md-h5,
.body .md-h6{
  font-family:var(--font-ui);
  font-size:var(--fs-15);
  font-weight:700;            /* 精确到 700：中文没有 600 字面，用 600 会被合成加粗 */
  color:var(--c-text-2);
  letter-spacing:.01em;
}

.body ul,
.body ol{ margin:0 0 14px; padding-left:1.45em; }
.body ul{ list-style:disc; }
.body ol{ list-style:decimal; }
.body li::marker{ color:var(--c-text-4); }
.body ol li::marker{ font-variant-numeric:tabular-nums; }
/* 列表里嵌套的段落不能再吃一次 14px，否则每条之间会空出一大截 */
.body li > p{ margin:0 0 var(--sp-1); }

/* 引用块：左侧一根强调细线 + 极淡底，不用整圈边框（正文里盒子越少越安静） */
.body blockquote{
  margin:var(--sp-4) 0;
  padding:var(--sp-3) var(--sp-4);
  border-left:3px solid var(--c-accent-line);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:var(--c-surface-2);
  color:var(--c-text-2);
}
.body blockquote p:last-child{ margin-bottom:0; }

/* 行内代码：极淡底 + 正文墨色。等宽字体本身已经足够"这是代码"，
   所以不加边框（一圈虚线框在日常阅读里是噪声）。 */
.body code{
  font-family:var(--font-mono);
  font-size:.92em;
  padding:.5px 5px;
  border-radius:var(--r-xs);
  background:var(--c-surface-3);
  color:var(--c-text);
}
.body pre code{ background:none; padding:0; font-size:inherit; color:inherit; }

.body a{
  color:var(--c-accent-ink);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:2px;
}
.body a:hover{ color:var(--c-accent); }
.body hr.md-hr{ border:0; border-top:1px solid var(--c-line); margin:var(--sp-6) 0; }

/* 公式里的上下标：宋体 + sup/sub 会把行高顶开，line-height:0 钉住行框 */
.body sup,
.body sub,
.md sup,
.md sub{ font-size:.7em; line-height:0; }
.body sup,
.md sup{ vertical-align:super; }
.body sub,
.md sub{ vertical-align:sub; }

/* 讲义里生成的 <img> 不带 class（只输出 src/alt/style），所以必须用元素选择器兜住：
   宽度不定、有的还是整页扫描件，不钉 max-width 会直接撑破卡片。 */
.body img,
.md img{
  max-width:100%; height:auto;
  display:block;
  margin:var(--sp-4) 0;
  border-radius:var(--r-md);
  border:1px solid var(--c-line-2);
}

/* 讲义自带的复习题高亮：中性暖底（保持继承字色），做"标记"而不是"警告" */
.body mark,
.md mark{
  background:var(--c-warn-soft);
  color:inherit;
  border-radius:3px;
  padding:0 3px;
}

/* 折叠块（讲义里的复习题答案）：
   ★ 这里**绝对不能做成"整块卡片"**。有的 <details> 只包一道题的答案，
     但有的一口气包住整节内容（实测 ch01-s02-p04 那个 details 高 9070px）——
     一旦套上浅底 + 圆角边框，整张阅读卡就变成一大块灰板，边框还画到屏幕外。
   所以只给 summary 做"可折叠的题头"：自定义 ▸/▾、悬停染色、展开时一条发丝线。
   容器本身不加任何盒子，多大多小都不会难看。 */
.body details,
.md details{ margin:var(--sp-4) 0; }
.body details > summary,
.md details > summary{
  display:flex; align-items:baseline; gap:6px;
  cursor:pointer;
  padding:var(--sp-1) 0;
  font-weight:700;              /* 700 而不是 600：SimSun 没有 600 字面 */
  color:var(--c-text);
  user-select:none;
  list-style:none;              /* 关掉 Chromium 默认的三角，换成下面的 ▸ */
}
.body details > summary::-webkit-details-marker,
.md details > summary::-webkit-details-marker{ display:none; }
.body details > summary::before,
.md details > summary::before{
  content:"▸";
  flex:none;
  font-size:.86em; line-height:1;
  color:var(--c-text-4);
  transform:translateY(.06em);
  transition:color var(--dur-2) var(--ease);
}
.body details[open] > summary::before,
.md details[open] > summary::before{ content:"▾"; color:var(--c-accent); }
.body details > summary:hover,
.md details > summary:hover{ color:var(--c-accent-ink); }
.body details[open] > summary,
.md details[open] > summary{
  margin-bottom:var(--sp-2);
  padding-bottom:7px;
  border-bottom:1px solid var(--c-line-2);
}
.body details > *:last-child,
.md details > *:last-child{ margin-bottom:0; }

.body figure,
.md figure{ margin:var(--sp-4) 0; padding:0; }
.body figcaption,
.md figcaption{
  margin-top:6px;
  font:400 var(--fs-125)/1.6 var(--font-ui);
  color:var(--c-text-3);
  text-align:center;
}

/* 管道表格：表头浅底 + 行分隔发丝线。宽度 100% 且允许长词断行，
   讲义里的表格常有长英文标识符。 */
.body table.md-table,
.md table.md-table{
  border-collapse:collapse;
  width:100%;
  margin:var(--sp-4) 0;
  overflow-wrap:anywhere;
}
.body table.md-table{ font-size:var(--fs-135); }
.md table.md-table{ font-size:var(--fs-13); }
.body table.md-table th,
.body table.md-table td,
.md table.md-table th,
.md table.md-table td{
  padding:var(--sp-2) var(--sp-3);
  border-bottom:1px solid var(--c-line-2);
  text-align:left;
  vertical-align:top;
}
.body table.md-table th,
.md table.md-table th{
  font:700 var(--fs-125)/1.6 var(--font-ui);
  color:var(--c-text-2);
  background:var(--c-surface-2);
  border-bottom-color:var(--c-line);
  white-space:nowrap;
}
/* ============================ 代码块 + 工具条 ============================
   .codeBlock = pre.md-pre + div.codeBar。
   两块上下拼接成一张卡：pre 只留上圆角，工具条只留下圆角，中间靠工具条的上边线分隔。
   ★ 这套不只卡片在用 —— 作业面板和 AI 解析页签也走 .codeBlock/.codeBar，
     所以不要把选择器写成 #card .codeBar 之类，否则那两处会掉样式。 */
pre.md-pre{
  margin:var(--sp-3) 0;
  padding:14px 16px;
  background:var(--c-code);
  border:1px solid var(--c-code-line);
  border-radius:var(--r-md);
  overflow:auto;
  font:400 var(--fs-13)/1.7 var(--font-mono);
  color:var(--c-text);
  white-space:pre;
  tab-size:4;
}
.codeBlock{ margin:var(--sp-4) 0; }
.codeBlock > pre.md-pre{
  margin:0;
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
  border-bottom:0;
}
.codeBar{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  padding:6px 10px 6px 12px;
  background:var(--c-surface-2);
  border:1px solid var(--c-code-line);
  border-top:1px solid var(--c-line-2);
  border-radius:0 0 var(--r-md) var(--r-md);
}
.codeBar button.tb{ font-size:var(--fs-12); padding:4px 10px; }
/* 「这段不适合直接跑」：工具栏换成 warn 浅底 + 一行说明，复制按钮仍然留着 */
.codeBar.adviceBar{
  background:var(--c-warn-soft);
  border-color:var(--c-warn-line);
  border-top-color:var(--c-warn-line);
}
.runAdvice{
  display:inline-flex; align-items:center; gap:6px;
  max-width:60ch;
  font-family:var(--font-ui); font-size:var(--fs-12);
  line-height:1.55; color:var(--c-warn);
}

/* ============================ 「跑一下」块 ============================
   整块是一张"可执行卡片"：头（白底）→ 代码（代码底）→ 操作（白底）。
   三段之间只用发丝线分隔，不用第三种底色 —— 这块和正文同处一页，不能比正文花。 */
.runBlock{
  margin:var(--sp-6) 0 0;
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-surface-2);
  overflow:hidden;
}
.runHead{
  display:flex; align-items:center; gap:6px;
  padding:var(--sp-2) var(--sp-4);
  background:var(--c-surface);
  border-bottom:1px solid var(--c-line);
  font:700 var(--fs-13)/1.6 var(--font-ui);
  color:var(--c-text);
}
.runHead .ico,
.runHead svg,
.runHead .emo .ico{ width:15px; height:15px; flex:none; color:var(--c-accent); }
.runCode{
  margin:0;
  padding:14px 16px;
  background:var(--c-code);
  overflow:auto;
  font:400 var(--fs-13)/1.7 var(--font-mono);
  color:var(--c-text);
  white-space:pre;
}
.runActions{
  display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-4);
  background:var(--c-surface);
  border-top:1px solid var(--c-line);
}
.runNote{
  margin-left:auto;
  font:400 var(--fs-12)/1.6 var(--font-ui);
  color:var(--c-text-3);
}

/* ============================ 参考链接 chip ============================
   一条 chip = 一个出口（讲义原文 / 100 Days / 外部链接 / 课件页）。
   白底 pill，hover 才染强调色 —— 一排 chip 全带色会抢正文。
   注意：chip 在右栏（#railBody）会被 shell 改成"列表行"，那套覆盖优先级更高，
   这里不要用 !important，否则右栏会退回 pill 样式。 */
.refs{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  margin:var(--sp-6) 0 0;
  padding-top:var(--sp-4);
  border-top:1px solid var(--c-line-2);
}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  max-width:100%;
  padding:5px 12px;
  border:1px solid var(--c-line);
  border-radius:var(--r-pill);
  background:var(--c-surface);
  color:var(--c-text-2);
  font:500 var(--fs-125)/1.6 var(--font-ui);
  white-space:nowrap;
}
.chip .ico,
.chip svg,
.chip .emo .ico{ width:14px; height:14px; flex:none; }
button.chip:hover:not(:disabled){
  background:var(--c-accent-soft);
  border-color:var(--c-accent-line);
  color:var(--c-accent-ink);
  transform:translateY(-1px);
  box-shadow:var(--sh-xs);
}
span.chip{ cursor:default; }
/* 「…共 N 页课件」这种残余计数：虚边 + 更弱，读起来是"说明"不是"按钮" */
span.chip.more{
  border-style:dashed;
  border-color:var(--c-line-strong);
  background:transparent;
  color:var(--c-text-3);
  font-weight:400;
}

/* ============================ 课件缩略图 ============================
   网格（flex-wrap，每张净宽 150px）：同一行高度自然不齐（课件页有横有竖），
   所以不给固定高度，只对齐到顶端。缩略图是 button 里套 img ——
   padding:0 + overflow:hidden 是必须的，否则图片直角会戳出圆角。 */
.slides{ margin:var(--sp-6) 0 0; }
.thumbRow{ display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:flex-start; }

button.thumbBtn{
  position:relative;
  display:block;
  padding:0;                        /* button 有默认内边距，会把图挤出圆角 */
  overflow:hidden;
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-surface-2);
  cursor:pointer;
}
button.thumbBtn:hover:not(:disabled){
  border-color:var(--c-accent-line);
  box-shadow:var(--sh-sm);
  transform:translateY(-2px);
}
button.thumbBtn:active:not(:disabled){ transform:translateY(-1px); }
img.thumb{
  display:block;
  width:150px; height:auto;
  min-height:84px;                  /* 还没水合（src 未设）时也占住一块，卡片不会塌一下 */
  background:var(--c-surface-2);
  /* 不用 aspect-ratio + object-fit：课件页是 4:3 / 16:9 混合，
     统一比例会在两侧留白、整块缩成"小图漂在白框里"。按原始比例显示，宽度吃满。 */
}
/* 页码角标压在左下：11px 半透明底，压在图上读得出又不盖住内容 */
.thumbCap{
  position:absolute; left:6px; bottom:6px;
  max-width:calc(100% - 12px);
  padding:0 6px;
  border-radius:var(--r-xs);
  background:color-mix(in srgb, var(--c-surface) 88%, transparent);
  color:var(--c-text-2);
  font:500 var(--fs-11)/1.7 var(--font-ui);
  font-variant-numeric:tabular-nums;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:var(--sh-xs);
  backdrop-filter:blur(2px);
}
/* 页还没本地化好：整张图降透明度，但保留可点区域（点开才知道缺哪一页） */
button.thumbBtn.missing{ opacity:.45; cursor:default; }
button.thumbBtn.missing:hover{
  border-color:var(--c-line);
  box-shadow:none;
  transform:none;
}
/* 「展开全部（共 N 页）」：一个虚线文字按钮，跟缩略图排在同一行里 */
button.thumbMore{
  align-self:center;
  padding:var(--sp-2) var(--sp-3);
  border:1px dashed var(--c-line-strong);
  border-radius:var(--r-md);
  background:transparent;
  color:var(--c-text-3);
  font:400 var(--fs-125)/1.6 var(--font-ui);
}
button.thumbMore:hover:not(:disabled){
  border-color:var(--c-accent-line);
  border-style:dashed;
  background:var(--c-accent-soft);
  color:var(--c-accent-ink);
}
/* 右栏是纵向单列（行方向由 shell 定），缩略图要撑满那张卡片的宽度 */
#railBody button.thumbBtn img.thumb{ width:100%; }
/* ============================ 空状态 / 收尾卡 ============================
   这两张卡是一个"断点"：内容没了 / 一节走完了。所以整块居中、留白比正文大。
   图标位 = 52px 圆形浅强调底盘 + 居中的 28px 图标（display:grid 居中）。
   JS 里那个符号现在是 emoji（运行时会被换成 <span class="emo"><svg class="ico">），
   下面把两种都钉成 28px，底盘尺寸不受影响。 */
.emptyCard,
.endCard{
  text-align:center;
  padding:var(--sp-8) var(--sp-4) var(--sp-10);
}
.emptyCard .emptyIco,
.endCard .endIco{
  width:52px; height:52px;
  margin:0 auto var(--sp-4);
  display:grid; place-items:center;
  border-radius:50%;
  background:var(--c-accent-soft);
  color:var(--c-accent);
  font-size:28px; line-height:1;   /* emoji 兜底；SVG 由下面的规则接管尺寸 */
  box-shadow:0 0 0 6px color-mix(in srgb, var(--c-accent) 6%, transparent);
}
.emptyCard .emptyIco .ico,
.emptyCard .emptyIco svg,
.endCard .endIco .ico,
.endCard .endIco svg{ width:28px; height:28px; display:block; }

.emptyCard h2,
.endCard h2{
  margin:0 0 var(--sp-2);
  font:700 var(--fs-24)/1.32 var(--font-read);
  color:var(--c-text);
}
.emptyCard p{
  margin:0 auto var(--sp-4);
  max-width:34em;
  font:400 var(--fs-135)/1.8 var(--font-ui);
  color:var(--c-text-2);
}
.emptyCard p code{
  font-family:var(--font-mono); font-size:.95em;
  padding:1px 5px; border-radius:var(--r-xs);
  background:var(--c-surface-3); color:var(--c-text-2);
}
.endCard .endStats{
  margin:0 0 var(--sp-1);
  font:400 var(--fs-16)/1.7 var(--font-read);
  color:var(--c-text-2);
}
.endCard .endSub{
  display:block; margin:0;
  font:400 var(--fs-135)/1.7 var(--font-ui);
  color:var(--c-text-3);
}
.endCard .endBtns{
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
  gap:var(--sp-3);
  margin-top:var(--sp-6);
}
.emptyCard .endBtns{ margin-top:var(--sp-5); }
/* 内容没载入成功时列出来的那几条错误：左对齐，方便一条条读路径 */
.errList{
  list-style:none;
  margin:0 auto var(--sp-4);
  padding:0;
  max-width:34em;
  display:flex; flex-direction:column; gap:2px;
  text-align:left;
  font:400 var(--fs-125)/1.75 var(--font-ui);
  color:var(--c-text-3);
}
.errList code{
  font-family:var(--font-mono);
  padding:1px 5px; border-radius:var(--r-xs);
  background:var(--c-surface-3); color:var(--c-text-2);
  overflow-wrap:anywhere;
}

/* ============================ 通用 markdown 容器 .md ============================
   100 Days 阅读器、AI 气泡、OJ 协议说明都用它。比 .body 小一号：
   这些场景的行宽本来就更窄（弹层 / 气泡），字号跟着收才不会显得挤。 */
.md{
  font-family:var(--font-read);
  font-size:var(--fs-16);
  line-height:1.9;
  color:var(--c-text);
  overflow-wrap:anywhere;
  font-variant-numeric:lining-nums tabular-nums;
}
.md > *:first-child{ margin-top:0; }
.md > *:last-child{ margin-bottom:0; }
.md p{ margin:0 0 var(--sp-3); }
.md .md-h{
  margin:var(--sp-5) 0 var(--sp-2);
  font-family:var(--font-read);
  font-size:var(--fs-17);
  font-weight:700;                  /* 精确 700：600 会被合成，中文发糊 */
  line-height:1.45;
  color:var(--c-text);
}
/* 一、二级标题（100 Days 里是"今日目标 / 练习"这类分块）比正文抬一档就够 */
.md .md-h1,
.md .md-h2{ font-size:var(--fs-18); }
.md ul,
.md ol{ margin:0 0 var(--sp-3); padding-left:1.4em; }
.md ul{ list-style:disc; }
.md ol{ list-style:decimal; }
.md li{ margin:2px 0; }
.md li::marker{ color:var(--c-text-4); }
.md blockquote{
  margin:var(--sp-3) 0;
  padding:var(--sp-2) var(--sp-4);
  border-left:3px solid var(--c-accent-line);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:var(--c-surface-2);
  color:var(--c-text-2);
}
.md code{
  font-family:var(--font-mono);
  font-size:.92em;
  padding:.5px 5px;
  border-radius:var(--r-xs);
  background:var(--c-surface-3);
  color:var(--c-text);
}
.md pre code{ background:none; padding:0; font-size:inherit; color:inherit; }
/* 阅读器里的代码比卡片正文里再小半档（12.5px）：这里的行普遍更长 */
.md pre.md-pre{ font-size:var(--fs-125); }
.md a{
  color:var(--c-accent-ink);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:2px;
}
.md a:hover{ color:var(--c-accent); }
.md hr.md-hr{ border:0; border-top:1px solid var(--c-line); margin:var(--sp-5) 0; }
.md img{ margin:var(--sp-3) 0; }

/* 独立成行的公式（两个美元符号包起来的）：居中、略大、行高放宽。
   不做成代码块 —— 公式不是代码，加边框会让人以为里面藏着可复制的东西。 */
.md .md-math{
  display:block;
  margin:var(--sp-4) 0;
  padding:2px 0;
  text-align:center;
  font-size:1.06em;
  line-height:2.1;
  overflow-x:auto;
}
.md .md-math sub,
.md .md-math sup{ font-size:.78em; }

/* 分式：inline-table 竖排（分子 / 分母中间一条线）。
   不用 table 元素是因为会继承 .md-table 的边框和宽度 —— 分式只是行内的一小块。 */
.frac{
  display:inline-table;
  vertical-align:middle;
  text-align:center;
  margin:0 .18em;
  font-size:.95em;
  line-height:1.25;
  border-collapse:collapse;
}
.frac > span{ display:table-row; }
.frac > span > span{ display:table-cell; padding:0 .3em; white-space:nowrap; }
.frac > span:first-child > span{ border-bottom:1px solid currentColor; }

/* 讲义原稿（notes.md 按行号取出的那一段）：pre-wrap 而不是 pre，
   原稿里有超长行，宁可折行也不出横向滚动条。 */
pre.notesPre{
  margin:var(--sp-3) 0 0;
  padding:14px 16px;
  background:var(--c-code);
  border:1px solid var(--c-code-line);
  border-radius:var(--r-md);
  white-space:pre-wrap;
  word-break:break-word;
  font:400 var(--fs-125)/1.75 var(--font-mono);
  color:var(--c-text);
}
.noteHead{
  margin:0 0 var(--sp-2);
  font:400 var(--fs-125)/1.6 var(--font-ui);
  color:var(--c-text-3);
}

/* ============================ 搜索命中高亮 ============================
   highlightInCard() 会在卡片的文本节点里包 mark.findmark，第一个命中处加 .here。
   ★ 必须写足三个选择器：讲义自带的 .body mark 是 (0,1,1)，只写 .findmark(0,1,0)
     会被它压住 —— 命中词就退成讲义那种淡暖黄，等于没高亮。
   普通 mark = 标记；findmark = 暖底 + 外圈；here = 更重的一档 + 更宽的外圈。 */
.findmark,
.body mark.findmark,
.md mark.findmark{
  background:var(--c-warn-soft);
  color:var(--c-warn);
  border-radius:3px;
  padding:0 3px;
  box-shadow:0 0 0 1px var(--c-warn-line);
}
.findmark.here,
.body mark.findmark.here,
.md mark.findmark.here{
  background:color-mix(in srgb, var(--c-warn) 24%, transparent);
  color:var(--c-text);
  font-weight:700;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--c-warn) 34%, transparent);
}

/* ============================ 响应式 ============================
   只有两档要做：1100（材料栏消失、目录变抽屉）和 1000（卡片内边距被 shell 收小）。
   正文行宽已经由 42em 兜住，所以这里只收"以大字号顶出来"的那几个元素。 */
@media (max-width:1100px){
  h2.cardTitle{ font-size:var(--fs-24); }
  .body .md-h1{ font-size:var(--fs-20); }
  .body .md-h2{ font-size:var(--fs-18); }
  .body .md-h3{ font-size:var(--fs-17); }
  img.thumb{ width:132px; }
}

@media (max-width:1000px){
  /* 正文 17.5 → 17：窗口窄了行长变短，字号不跟着收会显得"字很挤" */
  .body{ font-size:var(--fs-17); }
  .videoWrap{ margin-bottom:var(--sp-4); }
  .warnbar{ margin-bottom:var(--sp-5); }
  .warnbar.novideo{ margin-bottom:var(--sp-5); }
  iframe.bili{ border-radius:var(--r-sm); }
  .refs{ margin-top:var(--sp-5); }
  .runBlock{ margin-top:var(--sp-5); }
  .runHead,
  .runActions{ padding-left:var(--sp-3); padding-right:var(--sp-3); }
  .runNote{ margin-left:0; flex-basis:100%; }
  .slides{ margin-top:var(--sp-5); }
  .emptyCard,
  .endCard{ padding:var(--sp-6) var(--sp-3) var(--sp-8); }
  .emptyCard .emptyIco,
  .endCard .endIco{ width:46px; height:46px; margin-bottom:var(--sp-3); }
  .emptyCard h2,
  .endCard h2{ font-size:var(--fs-20); }
  .thumbRow{ gap:var(--sp-2); }
  img.thumb{ width:120px; }
  .body table.md-table{ font-size:var(--fs-125); }
}

/* ===== 40-panels.css ===== */
/* =====================================================================
   40-panels.css —— 面板与弹层
   ---------------------------------------------------------------------
   负责范围（老样式表 492–812 行那几段）：
     · 目录三级导航  .tocCh / .tocChId / .tocSec / .tocCnt / .tocNo / .tocTitle /
                     button.tocPt（.done / .tocMat / .here）
     · 弹层骨架      #modal / .modalBox / #modalBody / .lbImg / [data-kind=lightbox]
     · 搜索面板      .searchInput / .searchHit / .sh / .shch / .sn / .searchResults
                     + 100days 主题行 .topicRow / .topicName / .topicDays
     · OpenJudge     .ojNote / .ojBtns / .ojRow / .ojUrl(.big2) / .ojSmall
     · 作业          .hwHead / .hwTitle / .hwDeadline / .hwList / button.hwRow / .hwNo /
                     .hwRate(.low) / .hwGo / .hwActions / .newHwRow / .hwGroupHead(.first) /
                     .hwBlock / .tabBar / button.tab / .probHead / .lim / .ptChips
     · 验证徽章      .vfy(.ok/.skip) / details.vfy.bad / .vfyBox
     · AI 状态条     .aiBar / .aiNote / .aiStream(.cursor) / .aiErr / details.aiReason / .builtinTag
     · 测一测        textarea.probCode / .caseRow / .caseLbl / button.caseChip(.on/.ai) /
                     .caseOps / .caseHint / details.refSol / .refCode / .refActions /
                     .markDot(.ac/.wa) / button.markBtn(.on) / .allCase / .allHead / .miniPre(.bad) /
                     .allOk / button.confirming / button.subBtn / .hwStatsBar / .hwStats /
                     #ojEmail / #ojPass / .resBox / .resHead / .verdict(.pass/.fail/.skip) /
                     .resGrid / .preRow / .copyMini
     · AI 设置       .setRow / .setLabel / .setField / .rowIn / .setInput / .setHint / .setOk / .setBad
     · 100 Days      .daysBar / .dayRow / .dayNo / .dayMeta / .hit / .topicHit / .tk / .daysSec
   ---------------------------------------------------------------------
   与老样式表的差异（方向性修改，都写明了为什么）：
     1) 目录按"文档导航"做：章标题发丝线 + 吸顶，知识点整行可点（显式 display:block ——
        button 在老基础样式里是 inline-flex，不写就只包住文字，当前项高亮会像贴纸）；
     2) 弹层统一 18px 圆角 + --sh-xl；搜索做成"命令面板"（贴上部、更窄、输入框无边框）；
        遮罩仍由 shell 的 #scrim 负责，这里不重复上色（叠两层会糊成一片）；
     3) textarea.probCode 从浅灰输入框改成深色代码面（--c-term / --c-term-fg），
        和底部终端同一套 token；它仍是普通 textarea，可选中、可右键粘贴（没碰 user-select）；
     4) 结果框/样例框一律卡片化（圆角 + 发丝线 + pre 可滚动），长测试数据不再撑爆面板；
     5) 设置页两列表单（label 固定 84px），窄屏自动改上下排。
   ★ 不写 html[data-theme="dark"]：深色只覆盖 token（00-tokens.css）。
   ★ 不重复定义 #scrim / .panelHead / .xclose / #toc / #tocBody / #inlinePanel：盒子归 shell。
   ★ 助手面板（#modal[data-kind="assistant"] 与 .as* 那一套）在 50-ai.css，这里不碰。
   ===================================================================== */

/* ════════════════════════════════════════════════════════════════════
   目录：章 › 节 › 知识点
   --------------------------------------------------------------------
   这是应用的主导航，不是"按钮堆"：三级靠字号/字重/缩进/一条引导线区分，
   而不是三套底色。108 行里唯一能当路标的是章标题，所以它带发丝线并吸顶。
   ════════════════════════════════════════════════════════════════════ */

.tocCh{
  margin:var(--sp-4) 4px var(--sp-1);
  padding:var(--sp-3) 2px 2px;
  border-top:1px solid var(--c-line);
  font:600 var(--fs-14)/1.45 var(--font-ui);
  color:var(--c-text);
  letter-spacing:.01em;
  /* 吸顶：目录滚到 ch02 中段时，"现在在哪一章"必须一直看得见。
     背景必须是实色，否则下面的知识点会从标题缝里透出来。 */
  position:sticky; top:-8px; z-index:2;
  background:var(--c-surface);
}
.tocCh:first-child{ margin-top:var(--sp-1); padding-top:2px; border-top:0; }
/* 章号：等宽、压暗 —— 它是坐标，不是标题，别和章名抢 */
.tocChId{
  font-family:var(--font-mono);
  font-size:var(--fs-11);
  font-weight:600;
  color:var(--c-text-4);
  margin-right:7px;
  letter-spacing:.02em;
}

.tocSec{
  display:flex; align-items:baseline; gap:var(--sp-2);
  margin:10px 4px var(--sp-1);
  font:600 var(--fs-13)/1.5 var(--font-ui);
  color:var(--c-text);
}
/* 「第 N 节」是坐标、节名才是标题：拆开才能一灰一黑 */
.tocNo{
  flex:none;
  /* 400 而不是 500：11px 的中文在 500 下会明显比右边的计数（400）重，
     读起来像"第 N 节"是标题 —— 它其实只是个坐标，要比节名轻。 */
  font:400 var(--fs-11)/1.5 var(--font-ui);
  color:var(--c-text-4);
  font-variant-numeric:tabular-nums;
}
.tocTitle{ flex:1 1 auto; min-width:0; font-weight:600; }
.tocCnt{
  flex:none; margin-left:auto;
  font:400 var(--fs-11)/1.5 var(--font-ui);
  color:var(--c-text-4);
  font-variant-numeric:tabular-nums;
}

/* 知识点行。
   ★ display:block + width 必须显式写：button 的默认 display 是 inline-flex、
     width 是"贴合内容"，不写的话当前项那个蓝底只包住文字（实测 88px），
     看着像贴纸而不是"这一行是当前位置"。
   ★ white-space:normal：老基础样式给 button 设了 nowrap，长标题会顶出侧栏。 */
button.tocPt{
  display:block;
  width:calc(100% - 10px);
  margin-left:10px;
  padding:5px 10px 5px 12px;
  text-align:left;
  white-space:normal;
  border:0;
  border-left:1px solid var(--c-line);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  background:none;
  color:var(--c-text-2);
  font-size:var(--fs-125);
  line-height:1.55;
  transition:background-color var(--dur-2) var(--ease),
             color var(--dur-2) var(--ease),
             border-color var(--dur-2) var(--ease);
}
button.tocPt:hover:not(:disabled){
  background:var(--c-surface-3);
  border:0;                         /* 基础 button 的 1px 边框会挤掉左引导线 */
  border-left:1px solid var(--c-line-strong);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  color:var(--c-text);
}
/* 键盘焦点环往内画：目录是 overflow-x:hidden 的滚动区，外圈会被裁掉一半 */
button.tocPt:focus-visible{ outline:2px solid var(--c-accent); outline-offset:-2px; }
/* 已学（进度机制已砍，class 保留：契约要求，也为以后留口子） */
button.tocPt.done{ color:var(--c-ok); }
/* 材料入口（本章要学什么 / 本章总结）：强调色 + 600，但**不给底色** ——
   底色是"当前位置"专用的语义，两者混用就看不出自己在哪了。 */
button.tocPt.tocMat{ color:var(--c-accent-ink); font-weight:600; }
/* 当前位置 */
button.tocPt.here{
  background:var(--c-accent-soft);
  color:var(--c-accent-ink);
  font-weight:600;
  /* 左边缘从 1px 变 2px：padding 同步减 1px，文字不会横向跳一下 */
  border-left:2px solid var(--c-accent);
  padding-left:11px;
}
button.tocPt.tocMat.here{ color:var(--c-accent-ink); }

/* ════════════════════════════════════════════════════════════════════
   弹层骨架
   --------------------------------------------------------------------
   #modal 只是"居中容器 + 吃掉背景点击"（老行为：点遮罩不关窗，避免误触）；
   遮罩和它的 blur 由 shell 的 #scrim 负责 —— 这层再上一次色就会双重变暗。
   ════════════════════════════════════════════════════════════════════ */
#modal{
  position:fixed; inset:0;
  z-index:var(--z-modal);
  display:flex; align-items:center; justify-content:center;
  padding:var(--sp-8) var(--sp-5);
}
.modalBox{
  display:flex; flex-direction:column;
  width:100%; max-width:780px; max-height:88vh;
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-xl);
  overflow:hidden;                    /* 圆角要裁住 panelHead 的直角 */
  animation:popIn var(--dur-3) var(--ease);
}
/* 弹层头比面板头稍宽一点内边距：它是"窗口标题"，不是侧栏头 */
.modalBox > .panelHead{ padding:14px 18px 12px; }

/* 面板正文：唯一滚动区。滚动放在 body 上而不是整个 box 上 ——
   头（标题 + ✕）必须永远可见，长作业列表滚到底也关得掉。 */
#modalBody{
  flex:1 1 auto; min-height:0;
  overflow:auto;
  padding:var(--sp-4) var(--sp-5) var(--sp-5);
}

/* 课件大图：深底 + 无白边（图片本身才是内容，框越少越好） */
#modal[data-kind="lightbox"] .modalBox{
  max-width:1100px;
  background:var(--c-term);
  border-color:var(--c-term-line);
}
#modal[data-kind="lightbox"] .panelHead{ border-bottom-color:var(--c-term-line); }
#modal[data-kind="lightbox"] .panelHead b{ color:var(--c-term-fg); }
#modal[data-kind="lightbox"] .xclose{ color:var(--c-term-fg-dim); }
#modal[data-kind="lightbox"] .xclose:hover:not(:disabled){
  background:color-mix(in srgb, var(--c-term-fg) 14%, transparent);
  color:var(--c-term-fg);
}
#modal[data-kind="lightbox"] #modalBody{
  padding:0;
  display:flex; align-items:center; justify-content:center;
}
.lbImg{ max-width:100%; max-height:82vh; display:block; }

/* 「正在取课件第 N 页」那句的深底灰字由 90-polish 的 .lightboxLoading 负责
   （JS 原来那句内联 color 已经改成这个类了，所以这里不需要再压内联样式）。 */

/* ════════════════════════════════════════════════════════════════════
   搜索：命令面板
   --------------------------------------------------------------------
   和"内容弹层"不同，搜索是**瞬时覆盖**：贴上部、宽度收窄、结果紧贴输入框。
   这样眼睛不用在屏幕中间来回找，敲完回车就走。
   ════════════════════════════════════════════════════════════════════ */
#modal[data-kind="search"]{
  align-items:flex-start;
  padding-top:9vh;
}
#modal[data-kind="search"] .modalBox{ max-width:660px; max-height:78vh; }
#modal[data-kind="search"] #modalBody{ padding:var(--sp-4) var(--sp-4) var(--sp-4); }

.searchInput{
  width:100%;
  font:400 var(--fs-14)/1.5 var(--font-ui);
  color:var(--c-text);
  background:var(--c-surface-2);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  padding:9px 12px;
  outline:none;
}
.searchInput::placeholder{ color:var(--c-text-4); }
.searchInput:focus{
  background:var(--c-surface);
  border-color:var(--c-accent);
  box-shadow:var(--sh-focus);
}
/* 命令面板的输入框：更大、无边框（焦点环本身就是"这里在等你打字"）
   —— 边框 + 焦点环两层会显得脏 */
#modal[data-kind="search"] .searchInput{
  font-size:var(--fs-15);
  padding:12px 14px;
  border-color:transparent;
  /* 无边框时靠底色划出"输入区"：--c-surface-2 太接近白，整块看不出是输入框 */
  background:var(--c-surface-3);
}
#modal[data-kind="search"] .searchInput:focus{
  border-color:var(--c-accent);
  background:var(--c-surface);
  box-shadow:var(--sh-focus);
}

.searchResults{
  display:flex; flex-direction:column; gap:3px;
  margin-top:var(--sp-3);
  /* 底部留一点缝：面板滚到底时最后一行不会被 max-height 的边切在半腰，
     看起来像"截断 bug"。 */
  padding-bottom:var(--sp-2);
}
/* 搜索面板里的分组标题比正文里的小节标题更紧凑 ——
   命令面板一屏要放下尽可能多的结果，标题只当"分隔"用 */
#modal[data-kind="search"] .secHead{ margin:10px 0 4px; }

/* 命中行 = 结果行。
   ★ display:block + width:100% + text-align:left：button 默认 inline-flex + 居中，
     不写就变成一列居中的小方块（老样式踩过）。
   ★ white-space:normal：基础 button 是 nowrap，摘要会顶出一个横向滚动条。 */
.searchHit{
  display:block;
  width:100%;
  text-align:left;
  white-space:normal;
  border:0;
  background:none;
  border-radius:var(--r-sm);
  padding:11px 12px;
}
/* hover 给一条左侧强调条：结果行是"跳转入口"，得让人确认"点的是这一行" */
.searchHit:hover:not(:disabled){
  background:var(--c-surface-3);
  border:0;
  box-shadow:inset 2px 0 0 var(--c-accent);
}
.searchHit:focus-visible{ outline:2px solid var(--c-accent); outline-offset:-2px; }
.searchHit .sh{
  font-size:var(--fs-14);
  font-weight:600;
  color:var(--c-text);
}
/* 命中行开头的章号：搜索是跨章的，"第 5 节"在 ch02/ch03 里都存在，
   不标章号就不知道点下去会被带到哪一章 */
.searchHit .shch{
  display:inline-block;
  font:600 var(--fs-11)/1.6 var(--font-ui);
  color:var(--c-accent-ink);
  background:var(--c-accent-soft);
  border-radius:var(--r-xs);
  padding:0 5px;
  margin-right:1px;
  vertical-align:1px;
}
.searchHit .sn{
  margin-top:4px;
  font-size:var(--fs-13);
  color:var(--c-text-2);
  line-height:1.65;
  overflow-wrap:anywhere;
}
.searchHit .sn b{
  color:var(--c-accent-ink);
  background:var(--c-accent-soft);
  border-radius:var(--r-xs);
  padding:0 2px;
  font-weight:700;
}

/* 100Days 主题索引命中行（搜索面板里的另一种结果） */
/* 网格而不是 flex-wrap：主题名长短不一时，"哪几天讲过"那一列必须对齐，
   否则每行 chip 的起点都不一样，扫读时眼睛要重新找列。
   ★ 密度压到"行 4px / chip 12px"：100Days 主题索引是**附加信息**，
     而这一屏的主角是下面的知识点命中行 —— 搜索"列表"的人十有八九想跳讲义。 */
.topicRow{
  display:grid;
  grid-template-columns:96px minmax(0,1fr);
  align-items:start;
  gap:2px var(--sp-2);
  padding:4px var(--sp-1);
  border-bottom:1px solid var(--c-line-2);
}
.topicName{
  font-size:var(--fs-125);
  font-weight:600;
  color:var(--c-text-2);
  padding-top:3px;
}
.topicDays{ display:flex; gap:4px; flex-wrap:wrap; }
/* 主题索引里的 chip 收小一号（.chip 本体在 30-card.css，这里只做面板内的密度调整） */
.topicRow .chip{ font-size:var(--fs-12); padding:1px 8px; }

/* ════════════════════════════════════════════════════════════════════
   OpenJudge
   --------------------------------------------------------------------
   这一屏唯一要回答的问题是"为什么不在这里嵌 iframe"，所以把解释做成
   一块柔和的提示条（warn 语义：它是限制，不是错误），按钮纵向排成一列、
   每个按钮下面永远跟着可复制的地址（新窗口被拦时的唯一退路）。
   ════════════════════════════════════════════════════════════════════ */
.ojNote{
  font-size:var(--fs-135); line-height:1.75;
  color:var(--c-text-2);
  background:var(--c-warn-soft);
  border:1px solid var(--c-warn-line);
  border-radius:var(--r-md);
  padding:var(--sp-3) 14px;
  margin-bottom:var(--sp-4);
}
.ojNote b{ color:var(--c-warn); }
.ojNote code{
  background:color-mix(in srgb, var(--c-text) 6%, transparent);
  border-radius:var(--r-xs);
  padding:1px 5px;
  font-size:var(--fs-125);
}
.ojBtns{ display:flex; flex-direction:column; gap:var(--sp-3); }
.ojRow{ display:flex; flex-direction:column; gap:var(--sp-1); }
.ojRow button{ width:100%; }
.ojUrl{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  padding-left:2px;
}
.ojUrl code{
  font-family:var(--font-mono);
  font-size:var(--fs-12);
  color:var(--c-text-3);
  background:var(--c-surface-2);
  border-radius:var(--r-xs);
  padding:2px 6px;
  user-select:all;                    /* 三击即全选：这条地址是给"手动复制"用的 */
}
.ojUrl.big2{ margin-top:var(--sp-1); }
.ojSmall{
  margin-top:var(--sp-4);
  font-size:var(--fs-12);
  color:var(--c-text-3);
  line-height:1.7;
}

/* ---- 检查更新 ----
   这个面板天生很短（一行标题 + 两个按钮 + 一句说明），不撑一点高度会缩成
   一条窄卡，看起来像"加载失败"。说明句做成左侧 2px 的说明条：
   读起来是"解释"，不是"报错"。 */
#modal[data-kind="update"] #modalBody{ min-height:220px; }
#modal[data-kind="update"] #modalBody > .aiNote{
  background:var(--c-surface-2);
  border-left:2px solid var(--c-accent-line);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:10px 12px;
  color:var(--c-text-2);
  margin-bottom:var(--sp-3);
}
#modal[data-kind="update"] .panelRow{ margin-bottom:var(--sp-3); }

/* ════════════════════════════════════════════════════════════════════
   作业 / 小测
   --------------------------------------------------------------------
   一份题集 = 标题行 + 行式题目列表 + 操作栏；小测和作业共用同一套渲染，
   只靠 .hwGroupHead 分组。行式列表（而不是卡片网格）是因为题目有 10+ 条、
   标题很长，网格会变成一堆不等高的方块。
   ════════════════════════════════════════════════════════════════════ */
.hwHead{
  display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap;
  margin:2px 0 var(--sp-3);
}
.hwHead .hwTitle{
  font-size:var(--fs-17);
  font-weight:600;
  color:var(--c-text);
}
.hwDeadline{
  font-size:var(--fs-125);
  color:var(--c-warn);
  background:var(--c-warn-soft);
  border:1px solid var(--c-warn-line);
  border-radius:var(--r-pill);
  padding:1px 10px;
}
.hwList{ display:flex; flex-direction:column; gap:0; margin:6px 0 4px; }

/* 整行可点：display:flex + width:100% + text-align:left
   （button 默认 inline-flex/居中，不写就变成一条居中的小按钮） */
button.hwRow{
  display:flex; align-items:center; gap:var(--sp-3);
  width:100%;
  text-align:left;
  white-space:normal;
  border:0;
  border-bottom:1px solid var(--c-line-2);
  border-radius:0;
  background:none;
  padding:10px 6px;
}
button.hwRow:hover:not(:disabled){
  background:var(--c-surface-2);
  border:0;
  border-bottom:1px solid var(--c-line-2);
}
button.hwRow:focus-visible{ outline:2px solid var(--c-accent); outline-offset:-2px; }
/* 题号：圆形序号。悬停时跟着整行亮起，指路"点的是这一条" */
.hwNo{
  flex:none;
  width:26px; height:26px;
  display:grid; place-items:center;
  border-radius:50%;
  background:var(--c-surface-3);
  color:var(--c-text-3);
  font-size:var(--fs-12);
  font-weight:600;
  font-variant-numeric:tabular-nums;
  transition:background-color var(--dur-2) var(--ease),
             color var(--dur-2) var(--ease);
}
button.hwRow:hover .hwNo{ background:var(--c-accent-soft); color:var(--c-accent-ink); }
.hwRow .t{
  flex:1 1 auto; min-width:0;
  font-size:var(--fs-14);
  color:var(--c-text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.hwRate{
  flex:none;
  font-size:var(--fs-125);
  color:var(--c-text-4);
  font-variant-numeric:tabular-nums;
}
.hwRate b{ color:var(--c-ok); font-weight:600; }
.hwRate b.low{ color:var(--c-warn); }
.hwGo{ flex:none; font-size:var(--fs-12); color:var(--c-accent-ink); }

/* 操作栏：一条上发丝线 + 右侧状态（.sp 把状态顶到最右） */
.hwActions{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:14px; padding-top:14px;
  border-top:1px solid var(--c-line-2);
}
.newHwRow{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  margin-top:var(--sp-2);
}
.newHwRow code{
  font-family:var(--font-mono);
  font-size:var(--fs-125);
  background:var(--c-surface-2);
  border-radius:var(--r-xs);
  padding:1px 6px;
}

/* 分组标题（📝 作业 / 🧪 小测）：小测和作业走同一套渲染，只在这里分组 */
.hwGroupHead{
  display:flex; align-items:baseline; gap:var(--sp-2);
  margin:var(--sp-5) 0 2px; padding-top:var(--sp-4);
  border-top:1px solid var(--c-line);
  font-size:var(--fs-15);
  font-weight:600;
  color:var(--c-text);
}
.hwGroupHead.first{ margin-top:6px; padding-top:0; border-top:0; }
.hwGroupHead .n{ font-weight:400; font-size:var(--fs-125); color:var(--c-text-3); }
/* 块与块之间画线：上一块的"AI 已就绪…"和下一块标题之间以前是贴着的 */
.hwBlock + .hwBlock{
  margin-top:var(--sp-5); padding-top:var(--sp-4);
  border-top:1px solid var(--c-line-2);
}

/* 题目页签：下划线指示器（页签是"同一个页面的三个视图"，不是三张卡） */
.tabBar{
  display:flex; gap:var(--sp-1);
  margin:calc(-1 * var(--sp-1)) 0 14px;
  border-bottom:1px solid var(--c-line);
}
button.tab{
  border:0; border-radius:0;
  background:none;
  padding:8px 14px;
  margin-bottom:-1px;                 /* 指示器压在 .tabBar 那条线上 */
  font-size:var(--fs-135);
  color:var(--c-text-3);
  border-bottom:2px solid transparent;
}
button.tab:hover:not(:disabled){
  background:none;
  border:0;
  border-bottom:2px solid var(--c-line-strong);
  color:var(--c-text);
}
button.tab.on{
  color:var(--c-accent-ink);
  font-weight:600;
  border-bottom-color:var(--c-accent);
}
button.tab:focus-visible{ outline:2px solid var(--c-accent); outline-offset:-2px; }

.probHead{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-bottom:4px;
}
.probHead .lim{
  font-size:var(--fs-12);
  color:var(--c-text-3);
  font-family:var(--font-mono);
}
.ptChips{
  display:flex; gap:6px; flex-wrap:wrap;
  margin-top:var(--sp-3); padding-top:var(--sp-3);
  border-top:1px solid var(--c-line-2);
}

/* ════════════════════════════════════════════════════════════════════
   验证徽章（AI 代码块下方那条工具栏里的"已用样例验证 / 未验证 / 没过样例"）
   --------------------------------------------------------------------
   ok/skip 是 pill；bad 是 <details>（可以展开看用例和期望/实际的差异），
   所以 bad 不能写成 inline-flex —— 它得是一整块，展开时占满一行。
   ════════════════════════════════════════════════════════════════════ */
.vfy{
  font-size:var(--fs-12);
  line-height:1.5;
  border-radius:var(--r-pill);
  padding:2px 9px;
  white-space:nowrap;
}
span.vfy.ok{
  background:var(--c-ok-soft);
  color:var(--c-ok);
  border:1px solid var(--c-ok-line);
}
span.vfy.skip{
  background:var(--c-surface-3);
  color:var(--c-text-3);
  border:1px solid var(--c-line);
}
details.vfy.bad{
  background:var(--c-warn-soft);
  color:var(--c-warn);
  border:1px solid var(--c-warn-line);
  border-radius:var(--r-md);
  padding:2px 9px;
  cursor:pointer;
  white-space:normal;                 /* 理由可能很长（"代码里有大循环…"），必须能折行 */
}
details.vfy.bad[open]{ width:100%; padding:8px 12px; }
details.vfy.bad > summary{
  cursor:pointer; outline:none; list-style:none;
  font-size:var(--fs-12); font-weight:600;
}
details.vfy.bad > summary::-webkit-details-marker{ display:none; }
details.vfy.bad > summary:focus-visible{ outline:2px solid var(--c-accent); outline-offset:2px; }
.vfyBox{
  margin-top:6px;
  font-family:var(--font-mono);
  font-size:var(--fs-125);
  line-height:1.7;
  color:var(--c-warn);
  white-space:pre-wrap;
  word-break:break-word;
}
.vfyBox b{ font-weight:700; }
.vfyBox b.bad{ color:var(--c-err); }

/* 三个 <details> 共用一个小三角（原生 ▶ 在不同 WebView 版本里粗细不一） */
details.refSol > summary::before,
details.aiReason > summary::before,
details.vfy.bad > summary::before{
  content:"";
  display:inline-block;
  width:5px; height:5px;
  margin-right:7px;
  border-right:1.6px solid currentColor;
  border-bottom:1.6px solid currentColor;
  transform:rotate(-45deg) translateY(-1px);
  transition:transform var(--dur-2) var(--ease);
}
details.refSol[open] > summary::before,
details.aiReason[open] > summary::before,
details.vfy.bad[open] > summary::before{ transform:rotate(45deg) translateY(-1px); }

/* ════════════════════════════════════════════════════════════════════
   AI 状态条 / 流式输出 / 错误块
   --------------------------------------------------------------------
   .aiStream 里是 markdown 正文（排版在 30-card.css），这里只负责
   "光标"和最小高度 —— 流式时先撑开一块高度，页面不会每来一段就跳一下。
   ════════════════════════════════════════════════════════════════════ */
.aiBar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
