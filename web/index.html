  margin-bottom:var(--sp-3);
}
.aiNote{
  font-size:var(--fs-12);
  color:var(--c-text-3);
  line-height:1.65;
}
.aiStream{ min-height:40px; }
.aiStream .cursor{
  display:inline-block;
  width:7px; height:15px;
  border-radius:1px;
  background:var(--c-accent);
  vertical-align:-2px;
  animation:blink 1s step-start infinite;   /* 关键帧在 10-base.css */
}
.aiErr{
  border:1px solid var(--c-err-line);
  background:var(--c-err-soft);
  border-radius:var(--r-md);
  padding:10px 13px;
  color:var(--c-err);
  font-size:var(--fs-135);
  line-height:1.7;
  margin-bottom:var(--sp-3);
}
details.aiReason{
  margin-bottom:var(--sp-3);
  font-size:var(--fs-125);
  color:var(--c-text-3);
}
details.aiReason > summary{
  cursor:pointer; outline:none; list-style:none;
}
details.aiReason > summary::-webkit-details-marker{ display:none; }
details.aiReason > summary:hover{ color:var(--c-accent-ink); }
/* 思考过程 / "我要发送的 JSON"：可能几千行，必须限高 + 换行 + 自己滚
   （50-ai.css 里有同值的一份：那边也写了"两边取值一致"，改这里同步改那边） */
details.aiReason pre{
  margin:6px 0 0;
  padding:var(--sp-2) 11px;
  background:var(--c-code);
  border:1px solid var(--c-code-line);
  border-radius:var(--r-sm);
  font:var(--fs-12)/1.7 var(--font-mono);
  white-space:pre-wrap;
  word-break:break-word;
  color:var(--c-text-2);
  max-height:340px;
  overflow:auto;
}
/* 老样式里有 .builtinTag，但现在的 JS 里已经不再生成这个节点（grep 不到）。
   规则保留只是为了满足"老 class 不许丢"的覆盖契约。
   ★ 50-ai.css 里有同名同值的规则（那边也声明了"两边取值一致"）—— 改这里记得同步那边。 */
.builtinTag{
  display:inline-block;
  font-size:var(--fs-11);
  color:var(--c-text-3);
  background:var(--c-surface-2);
  border:1px solid var(--c-line);
  border-radius:var(--r-pill);
  padding:0 8px;
  margin-left:var(--sp-2);
}

/* ════════════════════════════════════════════════════════════════════
   测一测：代码框 / 用例 / 结果
   --------------------------------------------------------------------
   ★ 代码框是全 app 第二块"深色面"（第一块是底部终端）：写代码时眼睛
     不该在浅色输入框和深色终端之间来回适应。
   ★ 它仍然是普通 textarea —— 可选中、可右键粘贴、可拖高，
     只是把配色换到了 --c-term 这套 token 上（别写 user-select:none）。
   ════════════════════════════════════════════════════════════════════ */
textarea.probCode{
  width:100%;
  min-height:180px;
  resize:vertical;
  cursor:text;
  background:var(--c-term);
  border:1px solid color-mix(in srgb, var(--c-term-fg) 16%, transparent);
  border-radius:var(--r-md);
  padding:14px;
  font:var(--fs-13)/1.7 var(--font-mono);
  color:var(--c-term-fg);
  caret-color:var(--c-term-accent);
  tab-size:4;
  white-space:pre;                    /* 代码不自动换行：折行会把缩进打乱 */
  overflow:auto;
}
textarea.probCode:focus{
  border-color:var(--c-term-accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--c-term-accent) 22%, transparent);
}
textarea.probCode::placeholder{ color:var(--c-term-fg-dim); }
textarea.probCode::selection{
  background:color-mix(in srgb, var(--c-term-accent) 34%, transparent);
}

.caseRow{
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  margin:var(--sp-3) 0;
}
.caseLbl{ font-size:var(--fs-125); color:var(--c-text-3); margin-right:2px; }
button.caseChip{
  font-size:var(--fs-12);
  padding:3px 11px;
  border-radius:var(--r-pill);
  /* 用例标签来自"用例输入的第一行"，极端情况下会很长：
     限宽 + 省略，宁可截断也不能把一行撑出面板。 */
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}
button.caseChip.on{
  background:var(--c-accent-soft);
  border-color:var(--c-accent-line);
  color:var(--c-accent-ink);
  font-weight:600;
}
/* AI 生成的用例：虚线边 —— 输入是模型出的、期望值是本机算的，
   和"题目自带样例"不是一个可信度，必须看得见区别 */
button.caseChip.ai{ border-style:dashed; color:var(--c-text-2); }
button.caseChip.ai.on{ border-style:dashed; color:var(--c-accent-ink); }
.caseOps{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  margin-top:var(--sp-2);
}
.caseHint{ font-size:var(--fs-11); color:var(--c-text-4); }

/* 参考解：折叠 + 浅底，绝不预填进代码框（打开就看见答案，练习变抄） */
details.refSol{
  margin:var(--sp-3) 0 0;
  background:var(--c-surface-2);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  overflow:hidden;
}
details.refSol > summary{
  padding:9px 12px;
  font-size:var(--fs-125);
  color:var(--c-text-2);
  list-style:none; cursor:pointer; outline:none;
}
details.refSol > summary::-webkit-details-marker{ display:none; }
details.refSol > summary:hover{ color:var(--c-accent-ink); }
details.refSol > summary:focus-visible{ outline:2px solid var(--c-accent); outline-offset:-2px; }
details.refSol .refCode{
  margin:0; padding:2px 12px 10px;
  font:var(--fs-13)/1.7 var(--font-mono);
  color:var(--c-text-2);
  white-space:pre;                    /* 参考解要保住缩进，横向滚动比折行好读 */
  overflow:auto;
  max-height:320px;
}
details.refSol .refActions{ display:flex; gap:var(--sp-2); padding:0 12px 10px; }

/* 自己的 AC/WA 标记：题号旁边一颗小圆点 */
.markDot{
  width:6px; height:6px;
  border-radius:50%;
  display:inline-block;
  flex:none;
  margin-right:-4px;                  /* 贴着序号圆，别把 26px 的圆顶歪 */
}
.markDot.ac{ background:var(--c-ok); }
.markDot.wa{ background:var(--c-err); }
button.markBtn.on.ac{
  border-color:var(--c-ok-line);
  background:var(--c-ok-soft);
  color:var(--c-ok);
  font-weight:600;
}
button.markBtn.on.wa{
  border-color:var(--c-err-line);
  background:var(--c-err-soft);
  color:var(--c-err);
  font-weight:600;
}

/* 「全跑一遍」的失败明细 */
.allCase{ border-top:1px solid var(--c-line-2); padding:10px 12px 3px; }
.allHead{
  display:flex; align-items:baseline; gap:var(--sp-2);
  font-size:var(--fs-125);
  font-weight:600;
  color:var(--c-err);
}
.allHead .why{ font-weight:400; font-size:var(--fs-11); color:var(--c-text-3); }
.miniPre{
  margin:2px 0 7px;
  padding:5px 9px;
  background:var(--c-code);
  border:1px solid var(--c-code-line);
  border-radius:var(--r-sm);
  font:var(--fs-12)/1.6 var(--font-mono);
  white-space:pre-wrap;
  word-break:break-word;
  max-height:170px;
  overflow:auto;                      /* 长测试数据必须自己滚，不能撑爆面板 */
}
.miniPre.bad{ background:var(--c-err-soft); border-color:var(--c-err-line); }
.allOk{ font-size:var(--fs-125); color:var(--c-ok); padding:2px 12px 9px; }
/* 「全部生成解析」的二次确认态：强调成"再点一次就花钱"的样子 */
button.confirming{
  border-color:var(--c-accent);
  background:var(--c-accent-soft);
  color:var(--c-accent-ink);
  font-weight:600;
}
/* 题头的「自动提交」：primary 但按页头尺寸收小，别比标题还抢眼 */
button.subBtn{ padding:4px 12px; font-size:var(--fs-125); border-radius:var(--r-sm); }
/* 题集头部那行"通过率：12 秒前更新 · 点我刷新" */
.hwStatsBar{ display:flex; justify-content:flex-end; margin:-6px 2px 6px; }
button.linkbtn.hwStats{
  font-size:var(--fs-11);
  color:var(--c-text-4);
  text-decoration:none;
  padding:0 2px;
  background:none;
  border:0;
}
button.linkbtn.hwStats:hover:not(:disabled){
  background:none;
  color:var(--c-accent-ink);
  text-decoration:underline;
}
/* 登录框里的账号/密码要占满一行（.rowIn 是 flex，不写会缩成一小截） */
#ojEmail,#ojPass{ width:100%; min-width:0; }

/* 结果框：样例 / 本次运行 / 自动提交 / 全跑一遍，四处共用 */
.resBox{
  margin-top:14px;
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  overflow:hidden;
}
.resBox .resHead{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  padding:7px 12px;
  background:var(--c-surface-2);
  border-bottom:1px solid var(--c-line-2);
  font-size:var(--fs-125);
  font-weight:600;
  color:var(--c-text-2);
}
/* 结论药丸钉在最右：从页头一路扫下来，先看到"过没过" */
.resBox .resHead .verdict{
  margin-left:auto;
  font-size:var(--fs-12);
  font-weight:600;
  border-radius:var(--r-pill);
  padding:1px 9px;
}
.verdict.pass{ background:var(--c-ok-soft); color:var(--c-ok); border:1px solid var(--c-ok-line); }
.verdict.fail{ background:var(--c-err-soft); color:var(--c-err); border:1px solid var(--c-err-line); }
.verdict.skip{ background:var(--c-surface-3); color:var(--c-text-3); border:1px solid var(--c-line); }

.resGrid{
  display:grid;
  grid-template-columns:58px minmax(0,1fr);
  gap:var(--sp-2) var(--sp-3);
  padding:var(--sp-3);
  font-size:var(--fs-13);
}
.resGrid .k{ color:var(--c-text-3); font-size:var(--fs-125); padding-top:6px; }
.resGrid pre{
  margin:0;
  padding:var(--sp-2) 10px;
  background:var(--c-code);
  border:1px solid var(--c-code-line);
  border-radius:var(--r-sm);
  font:var(--fs-125)/1.7 var(--font-mono);
  white-space:pre-wrap;
  word-break:break-word;
  max-height:190px;
  overflow:auto;
}
.resGrid .why{ font-size:var(--fs-125); color:var(--c-text-3); line-height:1.7; }

/* 样例值 + 「复制」那一行：样例是数据不是代码，只给复制，不给"跑这段" */
.preRow{ display:flex; gap:var(--sp-2); align-items:flex-start; min-width:0; }
.preRow > pre{ flex:1 1 auto; min-width:0; }
.copyMini{
  flex:none;
  margin-top:3px;
  border:1px solid var(--c-line);
  background:var(--c-surface);
  border-radius:var(--r-xs);
  font-family:var(--font-ui);
  font-size:var(--fs-11);
  line-height:1.5;
  padding:3px 8px;
  color:var(--c-text-3);
  cursor:pointer;
  white-space:nowrap;
}
.copyMini:hover:not(:disabled){
  background:var(--c-accent-soft);
  border-color:var(--c-accent-line);
  color:var(--c-accent-ink);
}
.copyMini:active{ background:var(--c-accent-soft-2); }
.copyMini:focus-visible{ outline:2px solid var(--c-accent); outline-offset:1px; }

/* ════════════════════════════════════════════════════════════════════
   AI 设置
   --------------------------------------------------------------------
   两列表单：左列 label 固定 84px（所有输入框左边缘对齐才像"表单"），
   右列是控件 + 说明。窄屏（<1000px）改成上下排。
   ════════════════════════════════════════════════════════════════════ */
.setRow{
  display:flex; gap:var(--sp-3); align-items:flex-start;
  padding:var(--sp-3) 0;
  border-bottom:1px solid var(--c-line-2);
}
.setRow:last-of-type{ border-bottom:0; }
.setLabel{
  flex:none;
  /* 92px 而不是 84px：最长的标签「发给 AI 的内容」在 84px 下会折成两行，
     一折整张表单的左边界就不齐了（只差 8px，肉眼几乎看不出输入框变窄）。 */
  width:92px;
  padding-top:5px;
  font-size:var(--fs-13);
  font-weight:600;
  color:var(--c-text);
}
.setField{
  flex:1 1 auto; min-width:0;
  display:flex; flex-direction:column; gap:7px;
}
.setField .rowIn{ display:flex; gap:var(--sp-2); flex-wrap:wrap; align-items:center; }
input.setInput,select.setInput{
  font-family:var(--font-ui);
  font-size:var(--fs-135);
  padding:6px 10px;
  background:var(--c-surface);
  color:var(--c-text);
  border:1px solid var(--c-line-strong);
  border-radius:var(--r-sm);
  outline:none;
}
input.setInput{ flex:1 1 auto; min-width:170px; }
input.setInput:focus,select.setInput:focus{
  border-color:var(--c-accent);
  box-shadow:var(--sh-focus);
}
select.setInput:disabled,input.setInput:disabled{ opacity:.5; }
.setHint{
  font-size:var(--fs-12);
  color:var(--c-text-3);
  line-height:1.65;
}
.setHint b{ color:var(--c-text-2); font-weight:600; }
.setHint code{
  font-family:var(--font-mono);
  font-size:.95em;
  background:var(--c-surface-3);
  border-radius:var(--r-xs);
  padding:1px 5px;
}
.setOk{ color:var(--c-ok); font-weight:600; }
.setBad{ color:var(--c-err); font-weight:600; }

/* ════════════════════════════════════════════════════════════════════
   100 Days
   --------------------------------------------------------------------
   搜索框 + 按天列表。天数用等宽数字对齐（Day 05 / Day 21 竖着看是一列），
   每行的"打开 ›"是唯一真正的动作按钮，悬停整行时它才亮起来。
   ════════════════════════════════════════════════════════════════════ */
.daysBar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 10px;
}
.daysBar .searchInput{ flex:1 1 180px; min-width:180px; }
.dayRow{
  display:flex; align-items:center; gap:10px;
  padding:var(--sp-2) 6px;
  border-bottom:1px solid var(--c-line-2);
  transition:background-color var(--dur-2) var(--ease);
}
.dayRow:hover{ background:var(--c-surface-2); }
.dayNo{
  flex:none; width:52px;
  font:500 var(--fs-125)/1.6 var(--font-mono);
  color:var(--c-accent-ink);
  font-variant-numeric:tabular-nums;
}
.dayRow .t{ flex:1 1 auto; min-width:0; font-size:var(--fs-135); color:var(--c-text); }
.dayMeta{ flex:none; font-size:var(--fs-12); color:var(--c-text-3); }
.dayRow .hit{
  margin-top:3px;
  font-family:var(--font-mono);
  font-size:var(--fs-11);
  color:var(--c-text-4);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dayRow .hit b{ color:var(--c-accent-ink); font-weight:600; }
.dayRow .copyMini{ margin-top:0; color:var(--c-text-2); }
.dayRow:hover .copyMini{
  background:var(--c-accent-soft);
  border-color:var(--c-accent-line);
  color:var(--c-accent-ink);
}
/* 主题索引命中（搜索时才有）：键名等宽，后面的 chip 是"哪几天讲过" */
.topicHit{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  padding:6px;
  font-size:var(--fs-13);
  border-bottom:1px solid var(--c-line-2);
}
.topicHit .tk{ font-family:var(--font-mono); color:var(--c-text-2); }
.daysSec{
  margin:var(--sp-3) 0 2px;
  font-size:var(--fs-12);
  font-weight:600;
  color:var(--c-text-3);
}

/* ════════════════════════════════════════════════════════════════════
   可选中：内容 vs chrome
   --------------------------------------------------------------------
   面板里能被复制的只有"内容"（代码 / 样例 / 输出 / 命中词）；
   按钮、药丸、计数不可选 —— 拖选正文时不会顺手把按钮文字带进去。
   （基础样式已给 button 设了 none，这里只补面板里的非按钮元素。）
   ════════════════════════════════════════════════════════════════════ */
/* ★ 这里刻意不列 .probCode：它是 textarea，天生可选中 —— 给它写 user-select
   反而会让"能不能右键粘贴/能不能选"变成一个 CSS 问题；保持浏览器默认最稳。 */
.resGrid pre,.resGrid .why,.miniPre,.refCode,.vfyBox,.aiStream,
.aiReason pre,.setHint,.ojNote code,.ojUrl code,.dayRow .t,.topicHit .tk,
.hwRow .t,.searchHit .sh,.searchHit .sn{ user-select:text; }
.vfy,.verdict,.hwRate,.dayMeta,.caseHint,.tocCnt,.tocNo,.tocChId{ user-select:none; }

/* ════════════════════════════════════════════════════════════════════
   响应式
   --------------------------------------------------------------------
   1100：内嵌面板（作业/100 Days）还在用，但横行开始变挤 —— 先砍掉装饰性的
         「打开 ›」和通过率，保住标题和题号。
   1000：弹层内边距收小；设置页改上下排；结果表的标签换到值上面。
   ════════════════════════════════════════════════════════════════════ */
@media (max-width:1180px){
  .hwRow .hwGo{ display:none; }       /* 整行本来就能点，这个提示在窄屏是纯占位 */
}
@media (max-width:1000px){
  #modal{ padding:var(--sp-4); }
  #modal[data-kind="search"]{ padding-top:6vh; }
  #modal[data-kind="search"] .modalBox{ max-height:84vh; }
  .modalBox{ max-height:92vh; }
  #modalBody{ padding:var(--sp-3) var(--sp-3) var(--sp-4); }
  .modalBox > .panelHead{ padding:12px 14px 10px; }

  .tocCh{ font-size:var(--fs-135); }
  button.tocPt{ font-size:var(--fs-13); }

  .hwHead{ gap:var(--sp-2); }
  .hwRate{ display:none; }            /* 窄屏先让位：通过率不是决策信息 */
  .resGrid{ grid-template-columns:1fr; gap:2px var(--sp-3); }
  .resGrid .k{ padding-top:var(--sp-2); font-weight:600; }
  .resBox .resHead .verdict{ margin-left:0; }

  .setRow{ flex-direction:column; gap:6px; padding:10px 0; }
  .setLabel{ width:auto; padding-top:0; }

  .daysBar .searchInput{ min-width:140px; }
  .dayMeta{ display:none; }
  .probHead .lim{ font-size:var(--fs-11); }
}

/* ===== 50-ai.css ===== */
/* =====================================================================
   50-ai.css —— 内置终端（REPL）· 助教（AI）· toast
   ---------------------------------------------------------------------
   负责范围（对应 _redesign/ref/old.css）：
     430-491  🐍 内置终端：.replHead/.replHint/.replOut/.replInputRow/
              .replPrompt/.replIn/#replComp(.ci/.cfoot)/
              .rl 系列（rl/in/out/note/err）/.cn 系列（title/detail/hint/raw 等）/
              details.cnRaw/.cnRawPlain/button.tb(.on)
   ★ 注意：注释里**不许**出现「星号 + 斜杠」这个两字符组合（写通配符时要留空格），
     否则注释会提前结束，紧随其后的那条规则被当成非法选择器整条丢掉 —— 查过很久。
     657-663  AI 解析流：.aiBar/.aiNote/.aiStream/.aiStream .cursor
     664-707  🤖 助教面板：#modal[data-kind="assistant"] 的差异化 /
              .asPanelWrap/.asCtxBar/.asCtxTxt/.asMsgs/.asEmpty/.asRow/
              .asBubble/.asWho/.asErrLine/.asCursor/.asFoot/.asIn/.asHint/
              .aiErr/details.aiReason/.builtinTag
     823-826  #toast / #toast.show
     827-906  🤖 常驻助教（右下角）：#asFab/#asFabDot/.bubHead/.bubAvatar/
              .bubCtx/.bubIco/.bubMsgs/.bubInRow/.bubIn/.bubSend
   （#repl 的盒子本身、#replResize、#scrim 归 20-shell；#modal/.modalBox 的
     白底圆角阴影归 40-panels —— 这里只写"助教面板"这一层的差异化，别重复。）
   ---------------------------------------------------------------------
   这一版的取向：
   1) 终端是全 app **唯一**允许违背「浅色纸面」的地方 —— 它就该是黑的。
      所有颜色走 --c-term-* 这套 token（它本身就是深色，浅/深主题下都成立，
      所以这里一条 html[data-theme="dark"] 都不用写）。
      结构上照一台真终端做：头部像窗口标题栏（三个彩色圆点）、输出面比头部
      更深一档、>>> 用青蓝（--c-term-accent）而不是主强调蓝（#3B5BFD 在深底
      上发暗，和"提示符"这个角色也不搭）。
      ★ 终端里的文字**必须可选中**（用户要把报错复制出去搜），所以
        .replOut/.replIn 上没有任何 user-select 限制；只有 .rp/.replPrompt
        这种"提示符装饰"才关掉选中，免得复制输出时带出一串 >>>。
   2) 补全面板 #replComp 故意用**浅色浮层**：它是 UI（浮层），不是终端内容。
      深色里弹浅色看着突兀，但那正是"这是一个浮层、不是输出"的信号。
      （深色主题下它跟随 token 变深 —— 依然是浮层，靠 1px 线 + --sh-lg 区分。）
   3) 助教是白色 + 强调渐变点缀，像现代 chat：user 右对齐浅强调渐变、
      assistant 左对齐次级面，说话人那一侧的角收小 —— 这是 chat 的通用语法，
      比所有角都一样的圆角更像"在对话"。
   4) emoji：UI 上的 emoji 由 JS 在渲染后换成 <span class="emo"><svg class="ico">，
      所以按钮都是"图标 + 文字"（10-base 的 button 已带 gap:6px）。
      句中的 emoji（.asWho / .asHint / .cnHint）只做垂直对齐，别动间距。
   ---------------------------------------------------------------------
   与老样式的主要差异：
     · 终端从白底改成深色面（老 #repl 是 #fff + 浅灰输出区）；
     · 头部多了 .termLights（新 DOM，在 shell.html 里）—— 三个窗口圆点；
     · 助教圆钮从纯色块升级成渐变 + 光晕（--sh-fab），气泡改成白卡 + 渐变淡底头；
     · 气泡头多了 .bubAvatar 头像块（新 DOM）；
     · toast 用 --c-text 底 / --c-text-inv 字做反相：浅色下深底白字、
       深色下自动变浅底深字，一条深色规则都不用写。
   ---------------------------------------------------------------------
   "永远浅色"的三处（强调渐变上的图标/描边）一律用 --c-on-accent：
   强调色在深色主题下会变亮，白字仍然是白字，和 --c-term-fg 那种"终端前景"
   不是一回事。--c-on-accent-dim 只给"次要且不可用"的状态（见 .bubSend:disabled）。
   ===================================================================== */


/* ============================ 1. 内置终端 REPL ============================
   盒子（深色底 / 顶部拖拽条 / z-index）在 20-shell.css，这里只管盒子里。
   三段纵向：头部（--c-term-3）‖ 输出（--c-term-2，最深）‖ 输入行（--c-term-3）。
   输出面故意比头部更深：视线落点应该在最深那块上，头尾只是"框"。 */

.replHead{
  flex:none;
  display:flex; align-items:center; gap:10px;
  padding:8px 14px 8px 16px;
  background:var(--c-term-3);
  border-bottom:1px solid var(--c-term-line);
}
/* 三个窗口圆点：纯装饰（模拟真终端的窗口按钮），HTML 上带 aria-hidden。
   不用写死的红黄绿：语义 token 会和终端前景混一档，深底上才不发脏。 */
.termLights{ display:inline-flex; align-items:center; gap:6px; flex:none; margin-right:2px; }
.termLights i{
  display:block; width:9px; height:9px; border-radius:50%;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c-term) 34%, transparent);
}
.termLights i:nth-child(1){ background:color-mix(in srgb, var(--c-err) 74%, var(--c-term-fg)); }
.termLights i:nth-child(2){ background:color-mix(in srgb, var(--c-warn) 62%, var(--c-term-fg)); }
.termLights i:nth-child(3){ background:color-mix(in srgb, var(--c-ok) 70%, var(--c-term-fg)); }

.replHead b{
  font:600 var(--fs-13)/1.3 var(--font-ui);
  color:var(--c-term-fg);
  letter-spacing:.01em;
  white-space:nowrap;
}
/* 提示语：允许收缩但要省略号 —— 绝不把右边两个按钮挤出头部（窗口最小 900 宽） */
.replHint{
  min-width:0;
  font:400 var(--fs-12)/1.5 var(--font-ui);
  color:var(--c-term-fg-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* 终端头部的 .tb 必须整个换成深色版：10-base 的 .tb 是给浅色纸面用的，
   透明底深灰字放在 #141F36 上等于看不见。 */
#repl .replHead button.tb{
  background:transparent; border-color:transparent;
  color:var(--c-term-fg-dim); font-size:var(--fs-12);
}
#repl .replHead button.tb:hover:not(:disabled){
  background:color-mix(in srgb, var(--c-term-fg) 8%, transparent);
  border-color:transparent; color:var(--c-term-fg);
}
#repl .replHead button.tb:active:not(:disabled){
  background:color-mix(in srgb, var(--c-term-fg) 14%, transparent);
}
#repl .replHead button.tb.on{
  background:color-mix(in srgb, var(--c-term-accent) 16%, transparent);
  border-color:color-mix(in srgb, var(--c-term-accent) 34%, transparent);
  color:var(--c-term-accent); font-weight:600;
}
#repl button:focus-visible{ outline:2px solid var(--c-term-accent); outline-offset:1px; }

/* ---- 输出区 ----
   最深的一层。行内的空白由 .rl-out 的 pre-wrap 负责，这里只负责滚动。 */
.replOut{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  padding:12px 18px 14px;
  background:var(--c-term-2);
  color:var(--c-term-fg);
  font:var(--fs-13)/1.75 var(--font-mono);
  overscroll-behavior:contain;
}
/* 深色面里的选中高亮：全局那套是"浅底上盖淡蓝 + 深字"，在这里会让选中的字
   变成深底上的深字（等于糊掉）。换成青蓝底 + 终端前景色。 */
#repl ::selection{
  background:color-mix(in srgb, var(--c-term-accent) 30%, transparent);
  color:var(--c-term-fg);
}
/* 深色专用滚动条：浅灰 thumb 在 #0F1729 上根本看不见 */
#repl *{ scrollbar-color:color-mix(in srgb, var(--c-term-fg) 20%, transparent) transparent; }
#repl ::-webkit-scrollbar-thumb{
  background:color-mix(in srgb, var(--c-term-fg) 18%, transparent);
  border-radius:var(--r-pill); border:3px solid transparent; background-clip:content-box;
}
#repl ::-webkit-scrollbar-thumb:hover{
  background:color-mix(in srgb, var(--c-term-fg) 30%, transparent); background-clip:content-box;
}

/* ---- 输入行 ---- */
.replInputRow{
  flex:none;
  display:flex; align-items:flex-start; gap:8px;
  padding:10px 18px 12px;
  background:var(--c-term-3);
  border-top:1px solid var(--c-term-line);
  position:relative;              /* #replComp 的定位锚点：补全面板贴在这一行上沿外侧 */
}
/* >>> 用青蓝，且不可选：复制输出时不该把提示符带出来 */
.replPrompt{
  flex:none;
  color:var(--c-term-accent);
  font:var(--fs-13)/1.75 var(--font-mono);
  padding-top:2px;
  user-select:none;
}
/* 输入框：10-base 那套"白底 + 边框 + focus 环"在这里全部要洗掉 ——
   终端里冒出一个白框，整个观感就毁了。caret 用青蓝，和提示符呼应。 */
.replIn{
  flex:1 1 auto; min-width:0;
  border:0; outline:none; border-radius:0; box-shadow:none;
  resize:none; background:transparent;
  color:var(--c-term-fg);
  caret-color:var(--c-term-accent);
  font:var(--fs-13)/1.75 var(--font-mono);
  min-height:24px; max-height:132px; overflow-y:auto;
  padding:2px 0;
}
.replIn::placeholder{ color:var(--c-term-fg-dim); opacity:1; }
/* 键盘 focus 不画外框（10-base 的全局 :focus-visible 会在 textarea 上画圈）；
   光标本身就是焦点提示，再套一圈会让输入行看起来"被框住" */
.replIn:focus, .replIn:focus-visible{ outline:none; border:0; box-shadow:none; }
.replIn:disabled{ opacity:.55; color:var(--c-term-fg-dim); }

/* ---- 补全面板（#replComp）----
   绝对定位贴在输入行上沿外侧，不挡正在敲的字。
   ★ 它是"深色里弹出来的浅色浮层"：故意不跟着终端走深色 —— 补全是 UI，不是内容。 */
#replComp{
  position:absolute; right:18px; bottom:calc(100% + 6px); z-index:2;
  min-width:150px; max-width:min(340px, 70vw); max-height:206px;
  overflow-y:auto;
  padding:4px;
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  box-shadow:var(--sh-lg);
  font-family:var(--font-mono); font-size:var(--fs-125);
}
#replComp .ci{
  display:block; width:100%; margin:0;
  text-align:left; justify-content:flex-start;      /* 洗掉 10-base button 的居中 */
  border:0; border-radius:var(--r-xs); box-shadow:none;
  background:none;
  padding:5px 9px;
  font-family:inherit; font-size:inherit; font-weight:400;
  line-height:1.45;
  color:var(--c-text-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#replComp .ci b{ color:var(--c-accent-ink); font-weight:700; }
#replComp .ci:hover:not(:disabled){
  background:var(--c-surface-3); border-color:transparent; color:var(--c-text);
}
#replComp .ci.on,
#replComp .ci.on:hover:not(:disabled){
  background:var(--c-accent-soft); color:var(--c-accent-ink); font-weight:600;
}
#replComp .ci:focus-visible{ outline:2px solid var(--c-accent); outline-offset:-2px; }
#replComp .cfoot{
  margin-top:4px; padding:5px 9px 3px;
  border-top:1px solid var(--c-line-2);
  font-family:var(--font-ui); font-size:var(--fs-11);
  color:var(--c-text-4); white-space:nowrap;
}

/* ---- 输出行 ----
   四种行：.rl-in（用户敲的）/ .rl-out（程序输出）/ .rl-note（提示）/ .rl-err（报错卡）。
   .rl-in 与 .rl-out 都用终端前景色（白），靠 >>> 前缀区分"我敲的"和"它答的" ——
   整行染成青蓝，长输出读起来会累。 */
.rl{ margin:0 0 6px; }
.rl-in{ color:var(--c-term-fg); white-space:pre-wrap; word-break:break-word; }
.rl-in .rp{ color:var(--c-term-accent); margin-right:7px; user-select:none; }
.rl-out{
  margin:0 0 9px;
  font:inherit;                       /* pre 的 UA 字体会把 13/1.75 破坏掉 */
  color:var(--c-term-fg);
  white-space:pre-wrap; word-break:break-word;
}
/* 提示行是"人说的话"，不是程序输出：无衬线 + 灰，和等宽输出一眼分开 */
.rl-note{
  color:var(--c-term-fg-dim);
  font-family:var(--font-ui); font-size:var(--fs-125); line-height:1.7;
}
.rl-note code{
  font-size:.94em;
  background:color-mix(in srgb, var(--c-term-fg) 12%, transparent);
  border-radius:3px; padding:0 5px;
  color:var(--c-term-fg);
}

/* ---- 中文报错卡 ----
   深色里的错误块：暗红底 + 30% 红边（实心亮红边在深底上太吵）。
   三段信息：标题（什么错）/ 详情（为什么）/ 怎么办 ——"怎么办"那句用青蓝加粗，
   它是三段里唯一能让人动起来的信息，必须跳出来。 */
.rl-err{
  margin:0 0 10px;
  padding:10px 13px;
  background:var(--c-term-err-bg);
  border:1px solid color-mix(in srgb, var(--c-term-err) 30%, transparent);
  border-radius:var(--r-md);
  font-family:var(--font-ui);
}
.rl-err pre, .rl-err code{ font-family:var(--font-mono); }
.cnTitle{
  margin-bottom:4px;
  font:600 var(--fs-135)/1.5 var(--font-ui);
  color:var(--c-term-err);
}
.cnDetail{
  color:color-mix(in srgb, var(--c-term-err) 72%, var(--c-term-fg));
  font-size:var(--fs-13); line-height:1.75;
}
.cnHint{
  margin-top:5px;
  color:var(--c-term-accent);
  font:600 var(--fs-13)/1.7 var(--font-ui);
}
/* Python 原文折叠：默认收起、summary 小灰字（原文是给"想深挖"的人看的，
   不该和中文解释抢注意力）；pre 用白 6% 底，比错误卡底色再浅一档 */
details.cnRaw{ margin-top:8px; }
details.cnRaw summary{
  width:max-content; max-width:100%;
  cursor:pointer; outline:none;
  font-size:var(--fs-12);
  color:var(--c-term-fg-dim);
}
details.cnRaw summary:hover{ color:var(--c-term-fg); }
details.cnRaw pre{
  margin:6px 0 0; padding:6px 9px;
  border-radius:var(--r-xs);
  background:color-mix(in srgb, var(--c-term-fg) 6%, transparent);
  font:var(--fs-12)/1.6 var(--font-mono);
  white-space:pre-wrap; word-break:break-word;
  color:var(--c-term-fg-dim);
}
/* 没拿到中文解释时的兜底：只有原文，直接当"淡红等宽块"显示 */
.cnRawPlain{
  margin:0;
  color:color-mix(in srgb, var(--c-term-err) 82%, var(--c-term-fg));
  font-size:var(--fs-125); line-height:1.65;
  white-space:pre-wrap; word-break:break-word;
}


/* ============================ 2. AI 解析流（作业「解析」页签） ============================
   这一块长在**浅色卡片**里，不是终端 —— 所以用浅色 token。
   .aiStream 是流式正文容器，.cursor 是"还在生成"的唯一视觉信号（不能只在按钮上
   写"生成中"，用户看的是正文）。
   ★ 这一组 40-panels.css 也写了一版（它把这个状态条认领进了自己的头注释）。
     两边取值故意保持一致，避免"同一条错误卡两副面孔"；50 在 40 之后加载，
     所以最终以本文件为准。要改请两边一起改，或者干脆只留一边。 */
.aiBar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.aiNote{ font-size:var(--fs-12); color:var(--c-text-3); line-height:1.65; }
.aiStream{ min-height:40px; }
.aiStream .cursor{
  display:inline-block; width:7px; height:15px; border-radius:1px;
  background:var(--c-accent); vertical-align:-2px;
  animation:blink 1s step-start infinite;   /* blink 关键帧在 10-base */
}
/* 红色提示卡：浅色主题下是淡红底 + 深红字，深色主题下 token 一翻自动成立 */
.aiErr{
  margin-bottom:12px; padding:10px 13px;
  background:var(--c-err-soft);
  border:1px solid var(--c-err-line);
  border-radius:var(--r-md);
  color:var(--c-err);
  font-size:var(--fs-135); line-height:1.7;
}
.aiErr b{ font-weight:600; }
details.aiReason{ margin-bottom:12px; font-size:var(--fs-125); color:var(--c-text-3); }
details.aiReason summary{
  width:max-content; max-width:100%;
  cursor:pointer; outline:none;
}
details.aiReason summary:hover{ color:var(--c-accent-ink); }
details.aiReason pre{
  margin:6px 0 0; padding:8px 11px;
  max-height:340px; overflow:auto;
  background:var(--c-code);
  border:1px solid var(--c-code-line);
  border-radius:var(--r-sm);
  font:var(--fs-12)/1.7 var(--font-mono);
  white-space:pre-wrap; word-break:break-word;
  color:var(--c-text-2);
}
/* "内置解析（离线兜底）"的小标记：一行说明后面挂一枚浅药丸 */
.builtinTag{
  display:inline-block; margin-left:8px; padding:0 8px;
  border:1px solid var(--c-line);
  border-radius:var(--r-pill);
  background:var(--c-surface-2);
  font:500 var(--fs-11)/1.7 var(--font-ui);
  color:var(--c-text-3);
  vertical-align:1px;
}


/* ============================ 3. 助教面板（#modal[data-kind="assistant"]） ============================
   盒子（白底/圆角/阴影/居中/遮罩）归 40-panels；这里只做 assistant 这一层的差异化：
   面板占满弹层高度、消息区自己滚、输入行钉在底部。
   ★ 输入框只在"发送收尾"时动一次，流式过程中一个字节都不碰它（JS 契约）——
     这里唯一要保证的是它别被 flex 压扁（.asFoot 必须 flex:none）。 */
#modal[data-kind="assistant"] .modalBox{
  max-width:840px;
  height:86vh; max-height:86vh;
  overflow:hidden;                 /* 圆角要裁掉消息区的滚动条 */
}
#modal[data-kind="assistant"] #modalBody{
  display:flex; flex-direction:column;
  min-height:0; padding:0; overflow:hidden;
}
.asPanelWrap{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }

/* 上下文条：回答"助教在看哪一页"。它是 UI，不是正文 → 小字无衬线 */
.asCtxBar{
  flex:none;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 20px;
  background:var(--c-surface-2);
  border-bottom:1px solid var(--c-line-2);
  font-size:var(--fs-12); line-height:1.7;
  color:var(--c-text-3);
}
.asCtxBar b{ font-weight:600; color:var(--c-text-2); }
.asCtxBar .asCtxTxt{
  min-width:0;
  color:var(--c-accent-ink); font-weight:600;
  overflow-wrap:anywhere;
}

/* 消息区：唯一滚动区。scroll-behavior:smooth 是为了"流式追加时视线跟得上" */
.asMsgs{
  flex:1 1 auto; min-height:0;
  overflow-y:auto;
  padding:18px 20px 6px;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}
/* ---- 空状态（完整面板）----
   还没有对话时消息区是一大片空白，一行左对齐小字会像"没加载出来"。
   做成"图标 + 两行说明 + 示例问法"的居中小卡：
     · 图标 = 强调渐变的圆 + 三个点（和右下角圆钮、气泡头像同一套渐变语言，
       暗示"它在这里等你开口"）。三个点用三层 radial-gradient 直接画在圆上，
       这样 ::after 能空出来放示例 —— 两个伪元素刚好够用，不用改 DOM。
     · 示例问法用**引用式灰字**，不做成药丸按钮：现在没有"点 chip 直接发送"的
       动作，点了没反应的按钮比没有按钮更糟。真要做成可点 chip，得在 JS 的
       asMsgsHtml() 空态里加节点（这里只能到样式层）。 */
.asEmpty{
  position:relative;
  max-width:400px;
  margin:16px auto 6px;
  padding:72px 26px 22px;
  border:1px solid var(--c-line-2);
  border-radius:var(--r-lg);
  background:var(--c-surface-2);
  text-align:center;
  color:var(--c-text-3);
  font-family:var(--font-read);
  font-size:var(--fs-135); line-height:1.9;
}
/* 面板里只有这张卡时，让它在空白正中（有消息时这条自然不生效） */
.asMsgs:has(> .asEmpty:only-child){
  display:flex; align-items:center; justify-content:center;
}
.asEmpty::before{
  content:"";
  position:absolute; left:50%; top:18px;
  width:42px; height:42px; margin-left:-21px;
  border-radius:50%;
  /* 三层径向渐变 = 三个点，最后一层是圆的底色（从上往下叠，第一个在最上面） */
  background:
    radial-gradient(circle at 32% 50%, var(--c-on-accent) 0 2.5px, transparent 2.9px),
    radial-gradient(circle at 50% 50%, var(--c-on-accent) 0 2.5px, transparent 2.9px),
    radial-gradient(circle at 68% 50%, var(--c-on-accent-dim) 0 2.5px, transparent 2.9px),
    linear-gradient(145deg, var(--c-accent), var(--c-accent-2));
  box-shadow:0 4px 12px color-mix(in srgb, var(--c-accent) 26%, transparent);
}
/* 示例问法：不可点，所以做成"引用块"而不是 chip —— 顶部一条虚线把它和说明分开，
   颜色比正文再弱一档，读起来像脚注而不是控件。A 靠 white-space:pre-line 换行。 */
.asEmpty::after{
  content:"可以这样问\A 「这段代码为什么报错？」\A 「用一句话解释变量和对象的关系」\A 「把这一节的重点列成 3 条」";
  display:block;
  margin-top:16px;
  padding-top:12px;
  border-top:1px dashed var(--c-line);
  text-align:left;
  white-space:pre-line;
  font-family:var(--font-ui);
  font-size:var(--fs-12);
  line-height:1.95;
  color:var(--c-text-3);
  user-select:none;          /* 生成内容选中会带上伪元素，徒增困惑；要复制请照着敲 */
}
/* 第一行是"你可以做什么"，第二行才是补充说明。DOM 里两句话用一个 <br> 连着，
   没有独立标题元素 —— 所以用 ::first-line 只把第一行提成小标题。 */
.asEmpty::first-line{
  font-family:var(--font-ui);
  font-size:var(--fs-14);
  font-weight:600;
  color:var(--c-text-2);
}
.asRow{ display:flex; margin:0 0 14px; }
.asRow.user{ justify-content:flex-end; }
.asRow.assistant{ justify-content:flex-start; }

/* 气泡：assistant 无边框（用次级面），user 用强调渐变淡底。
   "说话人那一侧的角"收小 → 气泡有方向感；四角一样的圆角只是"卡片堆"。 */
.asBubble{
  max-width:100%;
  padding:10px 14px;
  border-radius:var(--r-lg);
  font-family:var(--font-read);
  font-size:var(--fs-15); line-height:1.85;
  overflow-wrap:anywhere;
  box-shadow:var(--sh-xs);
}
.asRow.assistant .asBubble{
  background:var(--c-surface-2);
  border:0;
  border-top-left-radius:var(--r-xs);
}
.asRow.user .asBubble{
  background:linear-gradient(135deg, var(--c-accent-soft), var(--c-accent-soft-2));
  border:1px solid var(--c-accent-line);
  border-top-right-radius:var(--r-xs);
  white-space:pre-wrap;
}
.asBubble .md{ font-size:var(--fs-15); line-height:1.85; }
.asWho{
  margin-bottom:4px;
  font-family:var(--font-ui);
  font-size:var(--fs-12); color:var(--c-text-4);
  letter-spacing:.02em;
}
.asRow.user .asWho{ text-align:right; }
/* 气泡里的错误行：一次失败的请求不该把已有内容擦掉，只在下面加一条红字 */
.asErrLine{
  margin:10px 0 2px; padding:8px 12px;
  background:var(--c-err-soft);
  border:1px solid var(--c-err-line);
  border-radius:var(--r-sm);
  color:color-mix(in srgb, var(--c-err) 74%, var(--c-text));
  font-family:var(--font-ui);
  font-size:var(--fs-13); line-height:1.7;
}
/* 流式光标 */
.asCursor{
  display:inline-block; width:7px; height:14px; margin-left:2px;
  border-radius:1px;
  background:var(--c-accent); vertical-align:-2px;
  animation:blink 1s step-start infinite;
}

/* 输入行：白底 + 上发丝线，钉在面板底部 */
.asFoot{
  flex:none;
  display:flex; align-items:flex-end; gap:9px;
  padding:12px 20px 10px;
  background:var(--c-surface);
  border-top:1px solid var(--c-line-2);
}
.asIn{
  flex:1 1 auto; min-width:0;
  resize:none;
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-surface);
  padding:8px 11px;
  font:var(--fs-135)/1.7 var(--font-ui);
  color:var(--c-text);
  max-height:150px; overflow-y:auto;
}
.asIn:focus, .asIn:focus-visible{
  outline:none;
  border-color:var(--c-accent);
  box-shadow:var(--sh-focus);
}
.asIn::placeholder{ color:var(--c-text-4); }
.asFoot button{ flex:none; }
/* 底部那行说明：比正文弱两档，但不能消失（"对话只存在这个窗口里"是重要信息） */
.asHint{
  flex:none;
  padding:0 20px 12px;
  background:var(--c-surface);
  font-family:var(--font-ui);
  font-size:var(--fs-12); line-height:1.6;
  color:var(--c-text-4);
}


/* ============================ 4. toast ============================
   一条底边居中的深色药丸。
   ★ 底色用**固定的深色面**（--c-term-3），不用 --c-text：
     用 --c-text 时深色主题会翻成"浅底深字"，在深色界面里像飘了一块白，
     会被当成界面出错（QA 截图抓到的）。现在两套主题都是"深底 + 近白字"，
     浅色下是经典黑色提示条，深色下是"浮起来的深色条"，都不打架。
   pointer-events:none：它出现在底栏上方，绝不能挡住"上一条/下一条"。 */
#toast{
  position:fixed; left:50%;
  bottom:calc(var(--h-footer) + 12px);
  transform:translateX(-50%) translateY(6px);
  z-index:var(--z-toast);
  max-width:min(560px, 82vw);
  padding:8px 16px;
  background:var(--c-term-3);
  color:var(--c-term-fg);
  border:1px solid color-mix(in srgb, var(--c-term-fg) 14%, transparent);
  border-radius:var(--r-pill);
  box-shadow:var(--sh-lg);
  font:500 var(--fs-125)/1.5 var(--font-ui);
  text-align:center;
  opacity:0; pointer-events:none;
  transition:opacity var(--dur-2) var(--ease),
             transform var(--dur-2) var(--ease);
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }


/* ============================ 5. 常驻助教（右下角） ============================
   层级是**故意**插在中间的：modal(60) < 圆钮(70) < 气泡(75) < toast(80)。
   圆钮要在弹层之上（否则弹层一开就点不到），但要在 toast 之下（提示条永远可见）。
   ★ 圆钮只在**完整助教面板**开着时让位（JS 的 asFabSync 判的）；内嵌面板不让 ——
     实测两者根本不重叠，白让位会把入口弄丢（老注释里记过这个坑）。 */
#asFab{
  /* bottom 用 calc(--h-footer)：圆钮必须停在底栏**上面**，不能骑在边框上 ——
     底栏右端有"← → 或 J K 翻卡"那行提示，圆钮压上去就像浮在边框外（老版本踩过）。 */
  position:fixed; right:22px; bottom:calc(var(--h-footer) + 16px);
  z-index:var(--z-fab);
  width:54px; height:54px; padding:0;
  border:0; border-radius:50%;
  display:grid; place-items:center;
  color:var(--c-on-accent);               /* 强调渐变上的图标：永远白，不跟主题翻 */
  background:linear-gradient(145deg, var(--c-accent), var(--c-accent-2));
  box-shadow:var(--sh-fab);
  cursor:pointer;
  transition:transform var(--dur-2) var(--ease),
             box-shadow var(--dur-2) var(--ease);
}
#asFab:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 12px 30px color-mix(in srgb, var(--c-accent) 44%, transparent);
  background:linear-gradient(145deg, var(--c-accent-2), var(--c-accent));
}
#asFab:active:not(:disabled){ transform:translateY(0) scale(.97); }
#asFab.on{ box-shadow:0 10px 26px color-mix(in srgb, var(--c-accent) 40%, transparent); }
#asFab svg{ display:block; width:22px; height:22px; }
#asFab:focus-visible{ outline:2px solid var(--c-accent); outline-offset:3px; }
/* 上下文刷新时闪一下的小圆点：让"它在跟着你"这件事**看得见**（否则纯隐形）。
   1.5px 近白描边是为了在渐变底上把圆点和图标分开。 */
#asFabDot{
  position:absolute; top:5px; right:5px;
  width:9px; height:9px; border-radius:50%;
  background:var(--c-term-ok);
  border:1.5px solid var(--c-on-accent);
  opacity:0; pointer-events:none;
  transition:opacity var(--dur-3) var(--ease);
}
#asFabDot.ping{ opacity:1; }

/* 常驻气泡：白卡（r-lg = 14 是 token 里最接近 16 的一档） */
#asBubble{
  position:fixed; right:22px; bottom:calc(var(--h-footer) + 74px); z-index:var(--z-bubble);
  width:min(380px, calc(100vw - 32px));
  max-height:min(62vh, 560px);
  display:flex; flex-direction:column;
  background:var(--c-surface);
  border:1px solid var(--c-line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);
  overflow:hidden;
}
#asBubble:not([hidden]){ animation:popIn var(--dur-3) var(--ease); }

/* 头部：一点强调色淡底从上面压下来（"这是助教，不是普通面板"），
   底部一条发丝线把它和消息区分开。 */
#asBubble .bubHead{
  flex:none;
  display:flex; align-items:center; gap:7px;
  padding:9px 9px 9px 11px;
  background:linear-gradient(180deg, var(--c-accent-soft), var(--c-surface));
  border-bottom:1px solid var(--c-line-2);
  font-size:var(--fs-13);
}
/* 头像：22px 强调渐变方块里放 13px 图标 —— 比圆形头像省地方，
   而且和左边的品牌标记、右下角的圆钮是同一套"渐变方块"语言。 */
#asBubble .bubAvatar{
  flex:none; width:22px; height:22px;
  border-radius:7px;
  display:grid; place-items:center;
  color:var(--c-on-accent);
  background:linear-gradient(145deg, var(--c-accent), var(--c-accent-2));
  box-shadow:0 2px 6px color-mix(in srgb, var(--c-accent) 32%, transparent);
}
#asBubble .bubAvatar svg{ display:block; width:13px; height:13px; }
#asBubble .bubHead b{
  font:600 var(--fs-135)/1.3 var(--font-ui);
  color:var(--c-text);
  white-space:nowrap;
}
/* 上下文行：单行省略，hover 变强调色（提示"点我可以重读"） */
#asBubble .bubCtx{
  flex:1 1 auto; min-width:0; margin-left:2px;
  padding:3px 6px;
  border:0; border-radius:var(--r-xs); box-shadow:none;
  background:none;
  justify-content:flex-start;
  font:500 var(--fs-12)/1.4 var(--font-ui);
  color:var(--c-text-3);
  text-align:left;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#asBubble .bubCtx:hover:not(:disabled){
  background:color-mix(in srgb, var(--c-accent) 10%, transparent);
  border-color:transparent; color:var(--c-accent-ink);
}
#asBubble .bubCtx:focus-visible{ outline:2px solid var(--c-accent); outline-offset:1px; }
/* 头部图标按钮：26px 命中区，svg 钉 15px（图标尺寸由 CSS 定，别让 viewBox 决定） */
#asBubble .bubIco{
  flex:none; width:26px; height:26px; padding:0;
  border:0; border-radius:var(--r-xs);
  background:none; color:var(--c-text-3);
  cursor:pointer;
  transition:background-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
#asBubble .bubIco:hover:not(:disabled){
  background:color-mix(in srgb, var(--c-accent) 10%, transparent);
  border-color:transparent; color:var(--c-accent-ink);
}
#asBubble .bubIco svg{ display:block; width:15px; height:15px; }
#asBubble .bubIco:focus-visible{ outline:2px solid var(--c-accent); outline-offset:1px; }

/* 气泡里的消息：比完整面板小一档（380px 宽里 15px 正文塞不下两句） */
#asBubble .bubMsgs{
  flex:1 1 auto; min-height:64px;
  overflow-y:auto;
  padding:12px 12px 6px;
  overscroll-behavior:contain;
}
#asBubble .bubMsgs .asRow{ margin-bottom:10px; }
#asBubble .bubMsgs .asRow:last-child{ margin-bottom:2px; }
#asBubble .bubMsgs .asBubble{
  padding:8px 11px;
  border-radius:var(--r-md);
  font-size:var(--fs-135); line-height:1.8;
}
#asBubble .bubMsgs .asRow.assistant .asBubble{ border-top-left-radius:var(--r-xs); }
#asBubble .bubMsgs .asRow.user .asBubble{ border-top-right-radius:var(--r-xs); }
#asBubble .bubMsgs .asWho{ font-size:var(--fs-11); margin-bottom:3px; }
#asBubble .bubMsgs .md{ font-size:var(--fs-135); line-height:1.8; }
/* 气泡里的空状态：同一套"图标 + 两行 + 示例问法"，但压紧一档
   （这块高度只有 64–180px，所以示例只留两条、字号 11）。
   ★ white-space:pre-line：JS 里两句话之间是 \n 而不是 <br>，
     不设这个就并成一行，"两行说明"就没了。 */
#asBubble .bubMsgs:has(> .asEmpty:only-child){
  display:flex; align-items:center; justify-content:center;
}
#asBubble .bubMsgs .asEmpty{
  max-width:none;
  margin:4px 2px 2px;
  padding:52px 14px 14px;
  border-radius:var(--r-md);
  font-size:var(--fs-125); line-height:1.75;
  white-space:pre-line;
}
#asBubble .bubMsgs .asEmpty::before{
  width:32px; height:32px; top:12px; margin-left:-16px;
  background:
    radial-gradient(circle at 32% 50%, var(--c-on-accent) 0 2px, transparent 2.4px),
    radial-gradient(circle at 50% 50%, var(--c-on-accent) 0 2px, transparent 2.4px),
    radial-gradient(circle at 68% 50%, var(--c-on-accent-dim) 0 2px, transparent 2.4px),
    linear-gradient(145deg, var(--c-accent), var(--c-accent-2));
  box-shadow:0 3px 9px color-mix(in srgb, var(--c-accent) 24%, transparent);
}
#asBubble .bubMsgs .asEmpty::after{
  /* 气泡里省掉"可以这样问"那行标题（高度只有 180 上下），引号本身已经说明是示例 */
  content:"「这段代码为什么报错？」\A 「把这一节的重点列成 3 条」";
  margin-top:10px;
  padding-top:8px;
  line-height:1.85;
  font-size:var(--fs-11);
}
#asBubble .bubMsgs .asEmpty::first-line{
  font-size:var(--fs-13);
}
#asBubble .bubMsgs pre.md-pre{ max-height:200px; }

/* 输入行。
   ★ 必须 flex:none：asAutoGrow 会给 textarea 设内联 height，而 #asBubble 是
     flex 列容器 —— 消息一多、总高触到 max-height 时，flex 会把这一行压扁，
     placeholder 被裁掉半行（老版本实测踩到过）。 */
#asBubble .bubInRow{
  flex:none;
  display:flex; align-items:flex-end; gap:8px;
  padding:10px;
  background:var(--c-surface);
  border-top:1px solid var(--c-line-2);
}
#asBubble .bubIn{
  flex:1 1 auto; min-width:0;
  resize:none; overflow:hidden;
  min-height:34px; max-height:120px;
  padding:8px 10px;
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-surface-2);
  font:var(--fs-13)/1.5 var(--font-ui);
  color:var(--c-text);
}
#asBubble .bubIn:focus, #asBubble .bubIn:focus-visible{
  outline:none;
  border-color:var(--c-accent);
  box-shadow:var(--sh-focus);
}
#asBubble .bubIn::placeholder{ color:var(--c-text-4); }
/* 发送键：强调色方块里放一个 16px 发送图标。
   padding:0 + 固定 34×34 是因为内容只有图标 —— 用文字键的 padding 会把它拉成胶囊。 */
#asBubble .bubSend{
  flex:none; width:34px; height:34px; padding:0;
  border:1px solid var(--c-accent);
  border-radius:var(--r-sm);
  display:grid; place-items:center;
  background:var(--c-accent);
  color:var(--c-on-accent);
  box-shadow:0 2px 6px color-mix(in srgb, var(--c-accent) 30%, transparent);
  transition:background-color var(--dur-2) var(--ease),
             border-color var(--dur-2) var(--ease),
             transform var(--dur-1) var(--ease);
}
#asBubble .bubSend:hover:not(:disabled){
  background:var(--c-accent-2); border-color:var(--c-accent-2); color:var(--c-on-accent);
}
#asBubble .bubSend:active:not(:disabled){ transform:translateY(.5px); }
/* 发送中/空内容：图标降一档亮度而不是整块发灰（整块 .5 会像"坏了"） */
#asBubble .bubSend:disabled{ color:var(--c-on-accent-dim); box-shadow:none; }
#asBubble .bubSend svg{ display:block; width:16px; height:16px; }
#asBubble .bubSend:focus-visible{ outline:2px solid var(--c-accent); outline-offset:2px; }


/* ============================ 6. 响应式 ============================
   断点和 shell 保持一致：1100（目录变抽屉）/ 900（窗口下限）。
   这一层目标很简单：**不崩** —— 头部按钮不被挤掉、输入行不被压扁、
   气泡和弹层不出窗口。 */
@media (max-width:1100px){
  .replHead{ padding:8px 12px; gap:8px; }
  .replOut{ padding:10px 12px 12px; }
  .replInputRow{ padding:8px 12px 10px; }
  #replComp{ right:12px; }
  .asCtxBar{ padding:8px 14px; }
  .asMsgs{ padding:16px 14px 4px; }
  .asFoot{ padding:10px 14px 8px; }
  .asHint{ padding:0 14px 10px; }
}
@media (max-width:900px){
  /* 头部只剩"●●● 试一试 ｜ 清空 收起"：提示语挤不下就整句收掉（信息在 placeholder 里） */
  .replHint{ display:none; }
  /* 窄屏只改尺寸和贴边距离；bottom 的单一来源在 90-polish（它 600 以下还会再抬一档），
     这里**不写** bottom —— 写了会在 601–900 区间和它打架。 */
  #asFab{ right:16px; width:50px; height:50px; }
  #asFabDot{ top:4px; right:4px; }
  #asBubble{
    right:12px;
    width:min(360px, calc(100vw - 24px));
    max-height:min(66vh, 520px);
  }
  #modal[data-kind="assistant"] .modalBox{ max-width:100%; height:88vh; max-height:88vh; }
  .asRow.assistant .asBubble,
  .asRow.user .asBubble{ border-radius:var(--r-md); }
  .asBubble, .asBubble .md{ font-size:var(--fs-14); }
  .asCtxBar{ padding:7px 12px; }
  .asMsgs{ padding:14px 12px 4px; }
  .asFoot{ padding:9px 12px 8px; }
  .asHint{ padding:0 12px 9px; }
  #toast{ bottom:calc(var(--h-footer) + 8px); }
}

/* ===== 90-polish.css ===== */
/* =====================================================================
   90-polish.css —— 收尾层：跨组件的小修正 + 图标占位
   ---------------------------------------------------------------------
   放在最后加载，所以这里的规则会压过前面同特异性的写法。
   ★ 只放"不属于任何单一组件"的东西；具体组件的手艺请回各自文件，别在这堆补丁。
   ===================================================================== */

/* ---------------- 运行时 emoji → 图标的包壳 ----------------
   见 app.js 的 uiEmojiSwap()：界面文本里的 emoji 会被替换成
   <span class="emo"><svg class="ico">…</svg></span>。
   这里只负责"让它和文字对齐、前后留一点呼吸"。 */
.emo{
  display:inline-flex; align-items:center; justify-content:center;
  vertical-align:-.16em;
  margin-right:.32em;
}
.emo:last-child{ margin-right:0; }
.emo .ico{ width:1.05em; height:1.05em; stroke-width:1.8; vertical-align:0; }
/* 空状态/收尾卡的那个大图标位：底盘是圆，图标 28px（视觉重量要压得住标题） */
.emptyIco .emo, .endIco .emo{ margin:0; }
.emptyIco .emo .ico, .endIco .emo .ico{ width:30px; height:30px; stroke-width:1.6; }
/* 图标栏/助教圆钮这类"图标即内容"的按钮：包壳不要留边 */
.sb .emo, .bubIco .emo, .xclose .emo, .railToggle .emo, #asFab .emo{ margin:0; }

/* 按钮里图标 + 文字的对齐：inline-flex 容器里 .emo 是 flex item，
   去掉那句 vertical-align 的遗留影响（不影响排版，只是心安）。 */
button > .emo{ align-self:center; }

/* ---------------- 少许通用修正 ---------------- */
/* 键盘提示这类小字在深色脊旁边容易看不清：保证最小对比 */
kbd{
  font-family:var(--font-mono); font-size:.92em;
  padding:1px 5px; border-radius:4px;
  background:var(--c-surface-3); color:var(--c-text-2);
  border:1px solid var(--c-line);
}
/* 长路径/长 URL 在面板里要能断行（作业题面常见） */
.setHint, .railHint, .asHint, .replHint{ overflow-wrap:anywhere; }

/* ---------------- 阅读卡顶部的一道强调发丝线 ----------------
   3px 渐变（强调 → 浅强调 → 透明）：给白色纸面一个"被点亮"的起点，
   同时不抢正文。只给 #card，不给 #inlinePanel —— 后者有自己的面板头。 */
#card::before{
  content:""; position:absolute; left:0; right:0; top:0; height:3px;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:linear-gradient(90deg, var(--c-accent) 0%, var(--c-accent-2) 42%, transparent 92%);
  opacity:.9;
  pointer-events:none;
}
/* 空状态卡不长内容，那道光就显得突兀了 */
#card:has(> .emptyCard:only-child)::before{ opacity:.45; }

/* ---------------- 深色面里的滚动条 ----------------
   深色面板上默认的浅色滚动条会跳出来打脸（终端、代码框）。 */
#repl ::-webkit-scrollbar-thumb,
textarea.probCode::-webkit-scrollbar-thumb,
.resGrid pre::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16); background-clip:content-box;
}
#repl ::-webkit-scrollbar-thumb:hover,
textarea.probCode::-webkit-scrollbar-thumb:hover,
.resGrid pre::-webkit-scrollbar-thumb:hover{
  background:rgba(255,255,255,.28); background-clip:content-box;
}

/* ---------------- 加载中：骨架 + 呼吸的圆环 ----------------
   只在"还没读到任何章节"时出现（正常路径几百毫秒），但它决定了第一印象：
   一块会呼吸的骨架比一行"内容还在生成中"更像一个成熟的应用。 */
.loadCard{ text-align:center; }
.loadOrb{
  width:46px; height:46px; margin:6px auto 14px;
  border-radius:50%;
  border:2px solid var(--c-line);
  border-top-color:var(--c-accent);
  animation:loadSpin .9s linear infinite;
}
@keyframes loadSpin{ to{ transform:rotate(360deg) } }
.loadCard h2{ font-family:var(--font-read); font-size:22px; font-weight:700; margin:0 0 6px; }
.loadCard .loadSub{ color:var(--c-text-3); font-size:13px; margin:0 0 22px; }
.skel{ display:flex; flex-direction:column; gap:10px; max-width:520px; margin:0 auto; }
.skel span{
  display:block; height:12px; border-radius:var(--r-pill);
  background:linear-gradient(90deg, var(--c-surface-3) 25%, var(--c-surface-2) 37%, var(--c-surface-3) 63%);
  background-size:400% 100%;
  animation:shimmer 1.5s ease-in-out infinite;
}
/* 尊重"减少动效"：骨架就别闪了，留一块静态灰 */
@media (prefers-reduced-motion:reduce){
  .skel span{ animation:none; }
  .loadOrb{ animation:none; border-top-color:var(--c-line-strong); }
}

/* ---------------- 从 JS 内联样式里搬出来的小类 ----------------
   这些以前是模板字符串里的 style="…"：内联样式没法参与主题（深色下写死的
   #8a6d00 / #c9ced6 会瞎），也没法响应窄屏。搬成类之后由 token 决定。 */
.panelRow{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.panelRow.tight{ margin-bottom:8px; }
.panelRow b{ font-size:var(--fs-135); color:var(--c-text); }
.grow{ flex:1 1 auto; min-width:0; }
.panelEmpty{ padding:16px 6px; }
.panelEmpty.tall{ padding:18px 6px; }
.aiBalVal{ font-size:var(--fs-15); font-weight:600; margin-right:4px; }
.warnInk{ color:var(--c-warn); }
.mt1{ margin-top:4px; }
.bodySm{ font-size:var(--fs-14); line-height:1.9; }
.monoNote{
  margin-top:6px; font:var(--fs-125)/1.7 var(--font-mono);
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.searchSecHead{ margin-top:16px; }
.lightboxLoading{ color:rgba(255,255,255,.55); }

/* ---------------- 助教圆钮别压在底栏上 ----------------
   原来 bottom:22px，圆钮正好骑在底栏（60px 高）右端，把"← → 或 J K 翻卡"那行
   提示挤掉一半，看起来像浮在边框上。抬到底栏上面之后它才真的"浮在内容区"。
   气泡跟着一起抬，免得一打开就盖住圆钮。 */
#asFab{ bottom:calc(var(--h-footer) + 16px); }
#asBubble{ bottom:calc(var(--h-footer) + 74px); }
@media (max-width:600px){
  #asFab{ bottom:calc(var(--h-footer) + 12px); }
  #asBubble{ bottom:calc(var(--h-footer) + 70px); }
}

/* 组件之间的纵向节奏：只有需要"比默认更开一档"的地方才加这个类 */
.stack{ margin-top:var(--sp-5); }

/* 测一测里"你的代码："标签：宽度交给内容（它不在两列表单里，占死 92px 会挤掉代码框） */
.codeLbl{ width:auto; margin-bottom:6px; }
/* 样例结果框与下面正文之间的呼吸 */
.resBoxSample{ margin:0 0 var(--sp-4); }
/* 搜索面板：主题索引整块（排在知识点命中之后）上面加一条分隔发丝线 */
.searchTopics{ margin-top:var(--sp-5); padding-top:var(--sp-3); border-top:1px solid var(--c-line-2); }

/* 历史类：老 DOM 的"连续天数"胶囊叫 .dailyStreak，新 DOM 用 .streak。
   留一条真正的规则只为满足"老 class 全部保留"的覆盖契约（覆盖检查会剥掉注释，
   光在注释里提一句不算数）。 */
.dailyStreak{ user-select:none; }

/* ---------------- 深色下的"弱提示"不能弱到看不见 ----------------
   .warnbar.novideo 在浅色里靠"灰字 + 2px 发丝线"退到背景后面是对的（104 张卡里 76 张都有它），
   但深色下 --c-text-3 与 --c-surface 的明度差不够，整行会糊掉。
   提一档到 --c-text-2 并把左发丝线换成 --c-line-strong：仍然是最弱的那一层，但读得出来。 */
html[data-theme="dark"] .warnbar.novideo{
  color:var(--c-text-2);
  border-left-color:var(--c-line-strong);
}

/* ---------------- 深色下的小字提示别掉到阈值以下 ----------------
   .asHint（助教面板底部那行"还没配 API Key…"）在深色里是 12px 的 --c-text-3，
   实测对比度 3.64:1 —— 低于小字号 4.5:1 的常规下限。提到 --c-text-2 后约 6.6:1，
   仍然明显弱于正文，但读得出来。 */
html[data-theme="dark"] .asHint{ color:var(--c-text-3); }
/* .navhint（底栏右侧"← → 或 J K 翻卡"）同一类问题：11px + --c-text-4，深色下 3.6:1。
   11px 属于"小字"，同样按 4.5:1 要求处理。 */
html[data-theme="dark"] .navhint{ color:var(--c-text-3); }
</style>
</head>
<body>

<!-- 悬停提示挂在 body 层：图标栏自己 overflow-y:auto，放里面会被裁掉 -->
<div id="sbTip" role="tooltip" hidden></div>

<div id="rightPane">
<header>
  <!-- 顶栏只回答"我在哪"：品牌 › 章 › 节。动作按钮全在图标栏里（别再往这加）。 -->
  <div class="hrow top">

<script>
"use strict";
/* =====================================================================
 * 智能计算概论学习终端 · 卡片流 UI（web/index.html）
 *
 * 安全总纲（重要）：
 *   1) 任何来自 content/*.json 的字符串，一律先经 escapeHtml() 再拼进 HTML；
 *   2) 本文件里出现的每一个标签（b/code/pre/a/ul/li/h4/blockquote/table/img…）
 *      都是**我自己写死的字面量**，只放在白名单位置；
 *   3) 绝不出现 `el.innerHTML = 后端字符串`。所有 innerHTML 的右值都是
 *      esc()/inline()/renderMarkdown()/buildXxxHtml() 的产物。
 * =================================================================== */

/* =====================================================================
 * 主题（浅色 / 深色）
 * ---------------------------------------------------------------------
 * 只有这一处碰 data-theme；组件样式一律读 CSS 变量 —— 换主题不重绘任何 DOM，
 * 也不需要 JS 去改任何一个颜色值（"改一处漏十处"是这个项目最常见的回归）。
 * 偏好存 localStorage 的 ic.theme.v1；没存过就跟随系统。
 * ★ 这段必须最先执行：脚本在 body 末尾，跑在首屏绘制之前，所以不会闪白。
 * =================================================================== */
var THEME_KEY = "ic.theme.v1";
function storedTheme(){
  try{
    var v = localStorage.getItem(THEME_KEY);
    if (v === "light" || v === "dark") return v;
  }catch(e){ /* 隐私模式 / 禁用存储：跟着系统走 */ }
  try{
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
  }catch(e){ /* 老环境没有 matchMedia */ }
  return "light";
}
function currentTheme(){
  var t = document.documentElement.getAttribute("data-theme");
  return t === "dark" ? "dark" : "light";
}
function applyTheme(t){
  t = (t === "dark") ? "dark" : "light";
  try{ document.documentElement.setAttribute("data-theme", t); }catch(e){}
  var b = $("btnTheme");
  if (b){
    b.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
    b.setAttribute("aria-label", t === "dark" ? "切到浅色主题" : "切到深色主题");
    b.setAttribute("data-tip", t === "dark"
      ? "主题 · 现在是深色，点一下切浅色"
      : "主题 · 现在是浅色，点一下切深色");
  }
}
function setTheme(t){
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  applyTheme(t);
}
/* 系统主题变了、而用户从没手动选过 → 跟着变（别覆盖用户的选择） */
try{
  if (window.matchMedia){
    var _mq = window.matchMedia("(prefers-color-scheme: dark)");
    var _onScheme = function(){
      var stored = null;
      try{ stored = localStorage.getItem(THEME_KEY); }catch(e){}
      if (stored !== "light" && stored !== "dark") applyTheme(_mq.matches ? "dark" : "light");
    };
    if (_mq.addEventListener) _mq.addEventListener("change", _onScheme);
    else if (_mq.addListener) _mq.addListener(_onScheme);
  }
}catch(e){ /* 无所谓：不跟随系统也能用 */ }
applyTheme(storedTheme());

   的 presentation attribute 规则 —— 实际上内联属性会被 CSS 覆盖，正好留着可调）。
   ============================================================================ */
function icon(name, cls){
  var p = ICONS[name];
  // 未知名字返回空串：界面重试/半截图状态下少一个图标可以接受，抛错白屏不行。
  if (!p) return '';
  return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none"' +
         ' stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"' +
         ' aria-hidden="true">' + p + '</svg>';
}

// 给需要"有没有这个图标"的调用方用（比如自检脚本、预览页）
function hasIcon(name){ return !!ICONS[name]; }

/* =====================================================================
 * UI 层 emoji → 内联 SVG 图标（运行时替换）
 * ---------------------------------------------------------------------
 * 为什么不在源码里一个个把 emoji 换成 icon() 调用：
 *   界面的 HTML 是 40 多个模板函数拼出来的，emoji 散在 200 多处字符串里，
 *   逐个改既容易漏、又会让 diff 变得没法 review。这里换成"渲染后扫一遍"：
 *   任何一次 innerHTML 重绘 / 流式追加都会触发，合并到下一帧统一替换。
 *
 * ★ 只换 UI，不换内容：正文（.body/.md）、代码（pre/code）、终端输出、
 *   输入框、AI 回复、题面/解析里的 emoji 是"内容"，必须原样保留 ——
 *   那些是讲义和 AI 写的东西，不是界面控件。
 * ★ 幂等：换完的节点里已经没有 emoji 了，所以不会自己触发自己形成死循环。
 * =================================================================== */
var EMOJI_SKIP = ".body,.md,pre,code,kbd,textarea,input,select," +
  ".rl-out,.rl-in,.replOut,.replIn,.cnDetail,.cnRawPlain,.cnRaw pre," +
  ".vfyBox,.miniPre,.resGrid pre,.allCase,.codeBlock pre,.runCode,.probCode,.asBubble pre";
/* 给"这段文本里有没有需要替换的 emoji"用的快速判断（按 IEMOJI 的键来，不猜 Unicode 区间） */
function _hasUiEmoji(s){
  if (!s) return false;
  for (var i = 0; i < s.length; i++){
    var two = s.substr(i, 2);
    if (IEMOJI[two]) return true;
    if (IEMOJI[s.charAt(i)]) return true;
  }
  return false;
}
/* 把一个文本节点的内容换成"文字 + 图标 span"混合的 fragment */
function _emojiNode(txt){
  var frag = document.createDocumentFragment();
  var buf = "", i = 0, hit = 0;
  while (i < txt.length){
    var two = txt.substr(i, 2), one = txt.charAt(i), name = IEMOJI[two] || IEMOJI[one];
    if (!name){
      /* 成对的 surrogate 必须整体保留，否则单个代理项会变成乱码方块 */
      var code = txt.charCodeAt(i);
      if (code >= 0xD800 && code <= 0xDBFF && i + 1 < txt.length){
        buf += txt.substr(i, 2); i += 2; continue;
      }
      buf += one; i += 1; continue;
    }
    if (buf){ frag.appendChild(document.createTextNode(buf)); buf = ""; }
    var span = document.createElement("span");
    span.className = "emo";
    span.innerHTML = icon(name);        /* icon() 的产物是本地字面量，没有外部输入 */
    frag.appendChild(span);
    i += IEMOJI[two] ? 2 : 1;
    hit++;
  }
  if (buf) frag.appendChild(document.createTextNode(buf));
  return hit ? frag : null;
}

     每帧都要建一次 TreeWalker 把全文件文本节点走一遍，纯属浪费。
     textContent 拼接是浏览器原生实现，几十 KB 也就几十微秒。 */
  try{
    if (!_hasUiEmoji(root.textContent)) return 0;
  }catch(e){ /* 极端情况（textContent 取不到）就走完整路径 */ }
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      var p = n.parentNode;
      if (!p || p.nodeType !== 1) return NodeFilter.FILTER_REJECT;
      var tag = String(p.tagName || "").toUpperCase();
      if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "INPUT" || tag === "OPTION"){
        return NodeFilter.FILTER_REJECT;
      }
      var skip = false;
      try{ skip = !!(p.closest && p.closest(EMOJI_SKIP)); }catch(e){ skip = false; }
      if (skip) return NodeFilter.FILTER_REJECT;
      return _hasUiEmoji(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  }, false);
  var nodes = [], n, count = 0;
  while ((n = walker.nextNode())) nodes.push(n);
  for (var k = 0; k < nodes.length; k++){
    var frag = _emojiNode(nodes[k].nodeValue);
    if (!frag) continue;
    if (nodes[k].parentNode) nodes[k].parentNode.replaceChild(frag, nodes[k]);
    count++;
  }
  return count;
}

/* 把一段 UI 文本里的 emoji 换成对应图标。
   可选用法（Lead 改 web/index.html 时用得上）：
     btn.innerHTML = emojiToIcon('🧪 用样例测');       // → '<svg …> 用样例测'
     hwGroupHead.innerHTML = emojiToIcon('📝 作业');
   注意：**不要**把它套在正文渲染上（md()、AI 回复、题面）—— 那里的 emoji 是内容。
   未知 emoji 原样留下，所以"套了也没替换"的地方会很明显，方便查漏。 */
function emojiToIcon(text){
  if (text == null) return '';
  var s = String(text), out = '', i = 0;
  // 逐个字符扫：不能直接用 replace(/[emoji]/g)，因为 ⚠️ 是 字符+FE0F 两个码位，
  // 必须先试"两码位"再试"单码位"，否则 📭️ 这类会被拆成两个。
  while (i < s.length){
    var two = s.substr(i, 2), one = s.charAt(i);
    if (IEMOJI[two]){ out += icon(IEMOJI[two]); i += 2; continue; }
    if (IEMOJI[one]){ out += icon(IEMOJI[one]); i += 1; continue; }
    out += one; i += 1;
  }
  return out;
}

/* 唯一的安全出口：& < > " ' 全部转义 */
function escapeHtml(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
/* 属性值出口（比 escapeHtml 多挡一层反引号与等号，非必需但更稳） */

/* 反解 escapeHtml 出来的实体（只用于"这段文本已经转义过了、但我需要原始 URL"的场合）。
   &amp; 必须最后还原，否则 &amp;lt; 会被解成 < 而不是 &lt; */
function unescapeEntities(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/&amp;/g, "&");
}

function todayStr(d){
  d = d || new Date();
  var m = String(d.getMonth() + 1), day = String(d.getDate());
  if (m.length < 2) m = "0" + m;
  if (day.length < 2) day = "0" + day;
  return d.getFullYear() + "-" + m + "-" + day;
}
function shiftDay(str, delta){
  var p = String(str).split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + delta);
  return todayStr(d);
}
/* 连续学习天数：从今天（今天没学就从昨天）往前数，断一天就停。
   当天学完 >=1 个知识点算一天；漏掉整整一天 -> 归零。 */
function computeStreak(days, today){
  var set = {};
  (days || []).forEach(function(d){ set[String(d)] = 1; });
  today = today || todayStr();
  var cur = set[today] ? today : shiftDay(today, -1);
  if (!set[cur]) return 0;
  var n = 0;
  while (set[cur]){ n++; cur = shiftDay(cur, -1); }
  return n;
}

/* url 白名单：只允许 http(s)/协议相对/相对路径；其它一律换成 # */
function safeUrl(u){

  if (/^(https?:)?\/\//i.test(s)) return u;
  if (/^[a-z][a-z0-9+.\-]*:/i.test(s)) return "#";   /* javascript: data: vbscript: … */

}

/* =====================================================================
 * markdown 子集渲染（先转义，再替换；只生成白名单标签）
 *   支持：标题 / 无序列表 / 有序列表 / 围栏代码块 / 行内代码 / 粗体 /
 *         链接 / 引用块 / 分隔线 / 管道表格 / 图片
 *   外加一个**只有 6 个标签的 HTML 白名单**（讲义自带的复习题要用）：
 *         img / details / summary / mark / figure / figcaption
 * =================================================================== */

/* 讲义原文里夹着少量 HTML。白名单之外的标签（script/b/div/iframe/svg/style…）
   一律照旧被 escapeHtml 转成可见文本 —— 不放开 HTML。
   唯一的文本级处理是删掉 HTML 注释（SLIDE 标记等），注释变不出标签。
   **注意**：这一步要在标签配对之前做，免得注释里的标签参与了配对。 */
function normalizeNotesHtml(src){
  return String(src === undefined || src === null ? "" : src)
    .replace(/\r\n?/g, "\n")
    .replace(/<!--[\s\S]*?-->/g, "");
}

/* ---------------- <img> 一对一白名单转换 ---------------- */
/* 相对路径按 content/notes/ 解析，再把 . / .. 折叠掉；
   折叠后如果还有 ..（想跳出 content/ 根目录）就整条拒绝。 */
function resolveContentRel(u){
  var s = String(u || "");
  var start = /^content\//.test(s) ? "" : "content/notes/";
  var parts = (start + s).split("/");
  var out = [];
  for (var i = 0; i < parts.length; i++){
    var seg = parts[i];
    if (seg === "" || seg === ".") continue;
    if (seg === ".."){
      if (!out.length) return null;          /* 逃出根目录 → 拒绝 */
      out.pop(); continue;
    }
    out.push(seg);
  }
  return out.length ? out.join("/") : null;
}
/* src 校验：只接受 http(s)（含协议相对）绝对 URL，或不含 : 的相对路径。
   javascript: / data: / vbscript: / C:\ 这些带冒号的一律拒绝。 */
function safeImgSrc(s){
  var u = String(s === undefined || s === null ? "" : s).trim();
  if (!u) return null;
  if (/^(https?:)?\/\//i.test(u)){
    return /[\s"'<>]/.test(u) ? null : u;
  }
  if (u.indexOf(":") >= 0) return null;
  if (/[\x00-\x1f"'<>\\]/.test(u)) return null;
  return resolveContentRel(u);
}
/* 从属性串里取一个属性值；取不到返回 "" */
function attrOf(attrs, name){
  var re = new RegExp("\\b" + name + "\\s*=\\s*(\"([^\"]*)\"|'([^']*)'|([^\\s\"'>]+))", "i");
  var m = String(attrs || "").match(re);
  if (!m) return "";
  return m[2] !== undefined ? m[2] : (m[3] !== undefined ? m[3] : (m[4] || ""));
}
/* 把 <img ...> 的属性串变成【我自己写死的】<img>：
   只提取 src / alt / width / style 里的 zoom:NN% —— 其它属性（onerror 之类）全部丢掉。 */
function imgHtml(attrs){
  var raw = String(attrs || "");
  var src = attrOf(raw, "src");
  var alt = attrOf(raw, "alt");
  var width = attrOf(raw, "width");
  var style = attrOf(raw, "style");
  var url = safeImgSrc(src);
  if (url === null) return null;             /* src 不合法 → 整条不生成（原样转义成文本） */
  var z = /zoom\s*:\s*(\d+)\s*%/i.exec(style);
  var styleOut;
  if (z) styleOut = "width:" + z[1] + "%";
  else if (/^\d+$/.test(width)) styleOut = "width:" + width + "px";
  else styleOut = "max-width:100%";
  return '<img src="' + attr(url) + '" alt="' + attr(alt) + '" style="' + attr(styleOut) + '">';
}

/* =====================================================================
 * HTML 白名单（6 个标签）
 *   规则：
 *     · 只认 img / details / summary / mark / figure / figcaption，别的全转义；
 *     · **属性一律丢弃**（不解析、不保留、不渲染）—— onerror/onclick/style 没机会；
 *     · 标签之间的文字一律走 escapeHtml；
 *     · 开闭必须配对，**不配对的（孤立 </mark>、没闭合的 <details>）整体转义**；
 *     · 合法标签先换成占位符（\u0002N\u0002），等整段 escapeHtml 之后再换回
 *       我自己写死的字面量，这样标签本身永远不会被转义、注入也进不来。
 * =================================================================== */
var ALLOWED_TAGS = { img: 1, details: 1, summary: 1, mark: 1, figure: 1, figcaption: 1, br: 1 };
var VOID_TAGS = { img: 1, br: 1 };          /* img / br 自成一体，不需要闭合 */
var BLOCK_TAGS = { details: 1, figure: 1 }; /* 这两个要自己占一块，不能包进 <p> */
/* 标签字面量写死在这两张表里：生成出来的 HTML 只可能来自这里，静态可查 */
var TAG_OPEN = {
  details: "<details>", summary: "<summary>", mark: "<mark>",
  figure: "<figure>", figcaption: "<figcaption>", br: "<br>"
};
var TAG_CLOSE = {
  details: "</details>", summary: "</summary>", mark: "</mark>",
  figure: "</figure>", figcaption: "</figcaption>"
};

var CUR_TOKENS = [];                        /* 本次 renderMarkdown 里合法标签的 HTML 字面量 */

/* 扫出所有「名字在白名单里」的标签（属性串原样带着，后面只用 img 会去解析它） */
function matchAllowedTags(text){
  var re = /<(\/?)([a-zA-Z][a-zA-Z0-9]*)\b([^>]*)>/g;
  var out = [], m;
  while ((m = re.exec(text))){
    var name = m[2].toLowerCase();
    if (!ALLOWED_TAGS[name]) continue;      /* 白名单之外的标签不认，原样留着给 escapeHtml */
    out.push({ start: m.index, end: re.lastIndex, closing: m[1] === "/", name: name, attrs: m[3],
               valid: false, html: null });
  }
  return out;
}
/* 配对：只有成对的才算合法；stack 是跨「文本段」共享的，所以 <details> 和 </details>
   中间夹一个围栏代码块也能配上 */
function planAllowedTags(text, stack){
  var ms = matchAllowedTags(text);
  for (var i = 0; i < ms.length; i++){
    var t = ms[i];
    if (VOID_TAGS[t.name]){
      if (t.closing) continue;                       /* </img> / </br> 非法 */
      if (t.name === "img"){
        var h = imgHtml(t.attrs);                    /* img 要单独校验 src/alt/style */
        if (h !== null){ t.valid = true; t.html = h; }
      }else{
        t.valid = true; t.html = TAG_OPEN[t.name];    /* br 之类：属性全丢，只留标签本身 */
      }
      continue;
    }
    if (!t.closing){ stack.push(t); continue; }       /* 先挂起，等它自己的闭合标签 */
    var top = stack[stack.length - 1];
    if (top && top.name === t.name){
      stack.pop();
      top.valid = true; top.html = TAG_OPEN[top.name];
      t.valid = true;   t.html = TAG_CLOSE[t.name];
    }
    /* 配不上（孤立闭合、或闭错了对象）→ valid 保持 false → 整体转义 */
  }
  return ms;
}
function applyTokens(text, matches){
  var out = "", last = 0;
  for (var i = 0; i < matches.length; i++){
    var t = matches[i];
    out += text.slice(last, t.start);
    if (t.valid){
      CUR_TOKENS.push(t.html);
      out += "\u0002" + (CUR_TOKENS.length - 1) + "\u0002";
    }else{
      out += text.slice(t.start, t.end);              /* 不合法 → 原样留着，最后被转义成纯文本 */
    }
    last = t.end;
  }
  return out + text.slice(last);
}
function tokenTag(html){
  var m = /^<(\/?)([a-z]+)>$/.exec(String(html || ""));
  return m ? { closing: !!m[1], name: m[2] } : null;
}
/* 这一行是不是以 details/figure/summary/figcaption 开头 —— 是的话它要自己占一块。
   不包 <p> 的原因：<summary> 必须是 <details> 的直接子元素，否则浏览器会另造一个
   默认的 "Details" 标题，折叠开关就废了。 */
function lineIsTagBlock(line){
  var m = /^\s*\u0002(\d+)\u0002/.exec(String(line || ""));
  if (!m) return false;
  var t = tokenTag(CUR_TOKENS[Number(m[1])]);
  if (!t) return false;
  return !!(BLOCK_TAGS[t.name] || t.name === "summary" || t.name === "figcaption");
}
/* 当前文本里 details/figure 的嵌套深度（用来把「列表项里开了一个 details」整段收进这一项） */
function blockDepth(text){
  var d = 0, m, re = /\u0002(\d+)\u0002/g, s = String(text || "");
  while ((m = re.exec(s))){
    var t = tokenTag(CUR_TOKENS[Number(m[1])]);
    if (!t || !BLOCK_TAGS[t.name]) continue;
    d += t.closing ? -1 : 1;
  }
  return d;
}

/* =====================================================================
 * 极简 LaTeX（不引 KaTeX/MathJax —— 那是外链，违反零依赖）
 *   只认 $...$ 行内公式，支持的构造就是讲义里真实出现过的那几种：
 *     \sqrt \le \ge \times \div \cdot \sum \approx \text{} \, ^x _x ^{} _{}
 *   认不出来就**整条按原文显示**（含 $），绝不半转换 —— 半个公式比原样更误导。
 * =================================================================== */
var MATH_SYMBOLS = {
  le: "≤", leq: "≤", ge: "≥", geq: "≥", neq: "≠", ne: "≠",
  times: "×", div: "÷", cdot: "·", pm: "±", approx: "≈", equiv: "≡",
